        const formatTimeWithMs = (date) => {
            if (!date) return '';
            const pad = (num, size) => num.toString().padStart(size, '0');
            const h = pad(date.getHours(), 2);
            const m = pad(date.getMinutes(), 2);
            const s = pad(date.getSeconds(), 2);
            const ms = pad(date.getMilliseconds(), 3);
            return `${date.toLocaleDateString()} ${h}:${m}:${s}.${ms}`;
        };

        const calculateDuration = (start, end) => {
            if (!start || !end) return '';
            const diff = end.getTime() - start.getTime();
            const minutes = Math.floor(diff / 60000);
            const seconds = Math.floor((diff % 60000) / 1000);
            const ms = diff % 1000;
            return `${minutes}m ${seconds}s ${ms}ms`;
        };

        const playPing = () => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(2000, ctx.currentTime);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch (e) {
                console.log("Audio failed to play", e);
            }
        };

            switch(item.id) {

                    return (

                            </div>
                            <div className="flex-1 relative bg-slate-200 flex items-center justify-center overflow-hidden">
                                {isMapsActive ? (
                                    <div className="absolute inset-0 bg-blue-50" style={{ backgroundImage: 'radial-gradient(#94a3b8 1px, transparent 1px)', backgroundSize: '15px 15px' }}>
                                        {/* Mock map elements */}
                                        <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-4xl drop-shadow-md animate-bounce">📍</div>
                                        <div className="absolute top-1/3 left-1/4 text-2xl drop-shadow-md opacity-70">🚚</div>
                                        <div className="absolute top-2/3 right-1/4 text-2xl drop-shadow-md opacity-70">🚚</div>

{
  "unit": "Truck-4",
  "lat": 34.0522,
  "lng": -118.2437,
  "status": "en_route"
}`}
                                        </div>

                case 'ui_search':
                    return (
                        <CardWrap activeState={isCustomActive}>

                                {isCustomActive ? <span className="text-green-600 text-[10px] bg-green-100 px-1 rounded border border-green-200">DB Connected</span> : <span className="text-red-500 text-[10px] bg-red-100 px-1 rounded border border-red-200">DB Offline</span>}

                            <div className="p-4 flex-1 flex flex-col bg-white">

                                        <svg className="w-10 h-10 text-red-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>

                case 'ui_sms':

        const App = () => {

            const [step, setStep] = useState('start'); 
            const [studentName, setStudentName] = useState('');
            const [nameError, setNameError] = useState(false);
            const [showConfirmModal, setShowConfirmModal] = useState(false);
            const [startTime, setStartTime] = useState(null);
            const [endTime, setEndTime] = useState(null);
            const [isDownloading, setIsDownloading] = useState(false);
            const certRef = useRef(null);

            // Lab state
            const [canvasItems, setCanvasItems] = useState([]); // Array of { id, x, y, width, height }
            const [selectedAPIs, setSelectedAPIs] = useState([]);
            const [jadMessages, setJadMessages] = useState(INITIAL_JAD_MESSAGES);
            const [isDragOver, setIsDragOver] = useState(false);
            const messagesEndRef = useRef(null);
            const prevMessageCountRef = useRef(INITIAL_JAD_MESSAGES.length);

            useEffect(() => {
                if (messagesEndRef.current) {
                    messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
                
                // Play ding ONLY if a new message was added during the simulation
                if (jadMessages.length > prevMessageCountRef.current && step === 'lab') {
                    playPing();
                }
                prevMessageCountRef.current = jadMessages.length;
            }, [jadMessages, step]);

            useEffect(() => {
                if (step !== 'lab') return;

                const checkRules = () => {
                    let newMessages = [];
                    const hasMapUI = canvasItems.some(i => i.id === 'ui_map');
                    const hasMapsAPI = selectedAPIs.includes('api_maps');
                    
                    const hasPaymentUI = canvasItems.some(i => i.id === 'ui_payment');
                    const hasStripeAPI = selectedAPIs.includes('api_stripe');

                    const hasSearchUI = canvasItems.some(i => i.id === 'ui_search');
                    const hasCustomAPI = selectedAPIs.includes('api_custom');

                    const hasSmsUI = canvasItems.some(i => i.id === 'ui_sms');
                    const hasTwilioAPI = selectedAPIs.includes('api_twilio');

                    // Ops Manager feedback
                    if (hasMapUI && !hasMapsAPI && !jadMessages.some(m => m.tag === 'map_warn')) {
                        newMessages.push({ sender: 'ops', text: "I see a map UI, but what data is feeding it? We should 'Buy' an API for this rather than 'Build' it.", tag: 'map_warn' });

                        newMessages.push({ sender: 'csr', text: "Great! Integrating Stripe means we don't have to build our own PCI-compliant payment server. It looks secure now.", tag: 'pay_success' });

                e.dataTransfer.setData('dragType', 'existing');
                e.dataTransfer.setData('itemId', item.id);
                // Calculate where inside the element the user clicked for smooth repositioning
                const rect = e.currentTarget.getBoundingClientRect();
                e.dataTransfer.setData('offsetX', e.clientX - rect.left);
                e.dataTransfer.setData('offsetY', e.clientY - rect.top);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragOver(false);
                
                const dragType = e.dataTransfer.getData('dragType');
                const itemId = e.dataTransfer.getData('itemId');
                if (!itemId) return;

                const compData = UI_COMPONENTS.find(i => i.id === itemId);
                if (!compData) return;

                const canvasRect = e.currentTarget.getBoundingClientRect();
                
                // Read offset if moving existing, otherwise assume center of component
                const offsetX = parseFloat(e.dataTransfer.getData('offsetX')) || (compData.width / 2);
                const offsetY = parseFloat(e.dataTransfer.getData('offsetY')) || (compData.height / 2);
                
                let newX = e.clientX - canvasRect.left - offsetX;
                let newY = e.clientY - canvasRect.top - offsetY;

                // Ensure it stays reasonably within bounds
                newX = Math.max(0, newX);
                newY = Math.max(0, newY);

                if (dragType === 'new') {
                    // Prevent duplicates
                    if (canvasItems.some(i => i.id === itemId)) return;
                    setCanvasItems([...canvasItems, { id: itemId, x: newX, y: newY, width: compData.width, height: compData.height }]);

                                    </div>

                                                    return (
                                                        <div key={`arch-${api.id}`} className="text-sm bg-slate-50 border border-slate-200 px-3 py-2 rounded-lg flex justify-between items-center shadow-sm">

                                        <p className="text-[10px] text-slate-500 uppercase font-black tracking-widest">Date Issued</p>

                                            <div className="absolute w-24 h-24 bg-gradient-to-br from-yellow-300 via-yellow-500 to-yellow-700 rotate-[75deg]"></div>
                                            
                                            {/* Inner Gold Medallion */}
                                            <div className="absolute w-20 h-20 rounded-full bg-gradient-to-tr from-yellow-500 via-yellow-400 to-yellow-200 border border-yellow-700/50 shadow-[inset_0_3px_6px_rgba(0,0,0,0.15)] flex items-center justify-center z-10">

                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="text-center w-72">
                                        <div className="border-b-2 border-slate-400 pb-2 mb-2 relative flex flex-col items-center justify-end h-20">
                                            {/* Static text for instructor name per prompt */}
                                            <span className="signature-font text-5xl text-blue-900 transform -rotate-2 opacity-90 drop-shadow-sm whitespace-nowrap">Timothy Brinkley</span>
                                        </div>
                                        <p className="text-[10px] text-slate-500 uppercase font-black tracking-widest">Instructor Signature</p>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                );
            }
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
