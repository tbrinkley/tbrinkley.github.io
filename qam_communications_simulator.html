      <circle cx="12" cy="12" r="10" />

    function App() {
      // --- Global State ---
      const [activeTab, setActiveTab] = useState('INTRO');
      const [isSyncUnlocked, setIsSyncUnlocked] = useState(false);
      const [isWavesUnlocked, setIsWavesUnlocked] = useState(false);
      const [isUnlocked, setIsUnlocked] = useState(false); // QAM
      const [isMathUnlocked, setIsMathUnlocked] = useState(false);
      const [certUnlocked, setCertUnlocked] = useState(false);

      // --- Packet Journey / WLAN Visualization State ---
      const [wlanScenario, setWlanScenario] = useState('ROUTER'); // 'ROUTER' or 'TOWER'
      const [duplexMode, setDuplexMode] = useState('HALF'); // 'HALF' (Wi-Fi) or 'FULL' (Cellular FDD)
      const [smoothTransition, setSmoothTransition] = useState(true); // Smooth pulse-shaping vs raw phase jump
      const [wlanStep, setWlanStep] = useState(0); // 0: Ready/Packet, 1: Modulating, 2: RF Wave in Air, 3: Demodulating & ACK
      const introCanvasRef = useRef(null);

      // --- Timer State ---
      const startTimeRef = useRef(Date.now());
      const [elapsedTimeStr, setElapsedTimeStr] = useState('0m 00s');
      const [certHash] = useState(() => Math.random().toString(36).substring(2, 10).toUpperCase());

      // --- Tab 1: Frequencies State ---
      const [freqValues, setFreqValues] = useState({ f900: 915, f24: 2440, f52: 5200, f58: 5780 });
      const [touchedFreqs, setTouchedFreqs] = useState({ f900: false, f24: false, f52: false, f58: false });
      const [showHopping, setShowHopping] = useState(false);
      const [quiz, setQuiz] = useState({ q1: '', q2: '', q3: '' });
      const freqCanvasRef = useRef(null);

      // --- Tab 2: Sync & Explorer State ---
      const [syncPhase, setSyncPhase] = useState('PLL'); // 'PLL' or 'EXPLORE'
      const [userFreq, setUserFreq] = useState(20);
      const [lockProgress, setLockProgress] = useState(0);
      const [isPhaseLocked, setIsPhaseLocked] = useState(false);
      const targetFreq = 50;

      const [hoverI, setHoverI] = useState(-3);
      const [hoverQ, setHoverQ] = useState(3);

      // --- Tab 3: I/Q Waves State ---
      const [wavesI, setWavesI] = useState(2);
      const [wavesQ, setWavesQ] = useState(2);
      const [showCombinedPreview, setShowCombinedPreview] = useState(true);

      // --- Tab 4: QAM Transmit State ---
      const [qamMode, setQamMode] = useState('MANUAL');
      const [status, setStatus] = useState('Ready to transmit');
      const [activeSymbol, setActiveSymbol] = useState(null);
      const [gameActive, setGameActive] = useState(false);
      const [targetWord, setTargetWord] = useState('RF');
      const [gameSymbols, setGameSymbols] = useState([]);
      const [currentSymbolIndex, setCurrentSymbolIndex] = useState(0);
      const [userI, setUserI] = useState(-3);
      const [userQ, setUserQ] = useState(-3);
      const [score, setScore] = useState(0);
      const [streak, setStreak] = useState(0);
      const [feedback, setFeedback] = useState(null);
      const [finalScore, setFinalScore] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);

      // --- Tab 5: Demodulator Math State ---
      const [mathSubTab, setMathSubTab] = useState('WALKTHROUGH'); // 'WALKTHROUGH' (Part 1: By Hand) or 'SIMULATOR' (Part 2: Wave Lab)
      const [demodI, setDemodI] = useState(3);
      const [demodQ, setDemodQ] = useState(-1);
      const [demodRefType, setDemodRefType] = useState('SINE'); // 'SINE' (I-axis) or 'COSINE' (Q-axis)
      const [activeTooltip, setActiveTooltip] = useState(null);
      const [showHiddenIngredients, setShowHiddenIngredients] = useState(true);
      const [isWavePaused, setIsWavePaused] = useState(false);

      // --- Tab 6: Certificate State ---
      const [studentName, setStudentName] = useState('');

      // --- Refs ---
      const timeRef = useRef(0);
      const audioCtxRef = useRef(null);
      const gainIRef = useRef(null);
      const gainQRef = useRef(null);

      const syncCanvasRef = useRef(null);
      const exploreCanvasRef = useRef(null);
      const gridCanvasRef = useRef(null);
      const waveCanvasRef = useRef(null);

      const wavesGridRef = useRef(null);
      const wavesOscRef = useRef(null);

      const mathTopRef = useRef(null);
      const mathMidRef = useRef(null);
      const mathBotRef = useRef(null);
      const mathGridRef = useRef(null);

      const animationRef = useRef(null);

      const formatElapsedTime = () => {
        const totalSeconds = Math.max(1, Math.floor((Date.now() - startTimeRef.current) / 1000));
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        if (hours > 0) {
          return `${hours}h ${minutes}m ${seconds.toString().padStart(2, '0')}s`;
        }
        return `${minutes}m ${seconds.toString().padStart(2, '0')}s`;
      };

      // --- Frequency Tab Handlers ---
      const handleFreqChange = (band, val) => {
        setFreqValues(prev => ({ ...prev, [band]: Number(val) }));
        setTouchedFreqs(prev => ({ ...prev, [band]: true }));
      };

      const checkFreqUnlock = () => {
        const allTouched = touchedFreqs.f900 && touchedFreqs.f24 && touchedFreqs.f52 && touchedFreqs.f58;
        const allCorrect = quiz.q1 === '900' && quiz.q2 === '58' && quiz.q3 === 'HOPPING';
        if (allTouched && allCorrect) {
          setIsSyncUnlocked(true);
        }
      };

      useEffect(() => {
        checkFreqUnlock();
      }, [touchedFreqs, quiz]);

      // --- Core QAM Logic & Audio ---
      const initAudio = () => {
        if (!audioCtxRef.current) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          audioCtxRef.current = new Ctx();
          const masterGain = audioCtxRef.current.createGain();
          masterGain.gain.value = 0.2;
          masterGain.connect(audioCtxRef.current.destination);

          const oscI = audioCtxRef.current.createOscillator();
          oscI.type = 'sine'; oscI.frequency.value = 300;
          gainIRef.current = audioCtxRef.current.createGain();
          gainIRef.current.gain.value = 0;
          oscI.connect(gainIRef.current).connect(masterGain);
          oscI.start();

          const oscQ = audioCtxRef.current.createOscillator();
          oscQ.type = 'sine'; oscQ.frequency.value = 600;
          gainQRef.current = audioCtxRef.current.createGain();
          gainQRef.current.gain.value = 0;
          oscQ.connect(gainQRef.current).connect(masterGain);
          oscQ.start();
        }
        if (audioCtxRef.current.state === 'suspended') audioCtxRef.current.resume();
      };

      const updateAudioGains = (iVal, qVal) => {
        if (!audioCtxRef.current || !gainIRef.current) return;
        const volI = (iVal + 4) / 7;
        const volQ = (qVal + 4) / 7;
        gainIRef.current.gain.setTargetAtTime(volI, audioCtxRef.current.currentTime, 0.05);
        gainQRef.current.gain.setTargetAtTime(volQ, audioCtxRef.current.currentTime, 0.05);
      };

      const silenceAudio = () => {
        if (gainIRef.current && audioCtxRef.current) {
          gainIRef.current.gain.setTargetAtTime(0, audioCtxRef.current.currentTime, 0.05);
          gainQRef.current.gain.setTargetAtTime(0, audioCtxRef.current.currentTime, 0.05);
        }
      };

      const bitsMap = {'-3': '00', '-1': '01', '1': '11', '3': '10'};

      const convertTextToSymbols = (text) => {
        const symbols = [];
        for (let i = 0; i < text.length; i++) {
          const char = text[i];
          const binary = char.charCodeAt(0).toString(2).padStart(8, '0');
          const b1 = binary.substring(0, 2);
          const b2 = binary.substring(2, 4);
          const b3 = binary.substring(4, 6);
          const b4 = binary.substring(6, 8);

          const getCoord = (b) => b === '00' ? -3 : b === '01' ? -1 : b === '11' ? 1 : 3;

          symbols.push({ char, fullBinary: binary, isFirstHalf: true, bits: b1+b2, i: getCoord(b1), q: getCoord(b2) });
          symbols.push({ char, fullBinary: binary, isFirstHalf: false, bits: b3+b4, i: getCoord(b3), q: getCoord(b4) });
        }
        return symbols;
      };

      // --- Auto / Manual Game Logic ---
      const startGame = () => {
        initAudio();
        const wordToUse = targetWord.trim() || 'RF';
        const symbols = convertTextToSymbols(wordToUse);
        setGameSymbols(symbols);
        setCurrentSymbolIndex(0);
        setScore(0);
        setStreak(0);
        setUserI(-3); setUserQ(-3);
        setActiveSymbol(symbols[0]);
        updateAudioGains(-3, -3);
        setGameActive(true);
        setFeedback(null);
        setStatus('Manual Link Active');
      };

      const handleSliderChange = (axis, val) => {
        initAudio();
        const newVal = Number(val);
        let nextI = axis === 'I' ? newVal : userI;
        let nextQ = axis === 'Q' ? newVal : userQ;
        if (axis === 'I') setUserI(newVal); else setUserQ(newVal);
        updateAudioGains(nextI, nextQ);
        if (gameActive && gameSymbols[currentSymbolIndex]) {
          setActiveSymbol({ ...gameSymbols[currentSymbolIndex], userDisplayI: nextI, userDisplayQ: nextQ });
        }
      };

      const transmitManualSymbol = () => {
        const cur = gameSymbols[currentSymbolIndex];
        if (!cur) return;
        if (userI === cur.i && userQ === cur.q) {
          setFeedback('CORRECT');
          const newScore = score + 100 + (streak * 20);
          setScore(newScore); setStreak(s => s + 1);

          if (currentSymbolIndex + 1 < gameSymbols.length) {
            setTimeout(() => {
              setFeedback(null);
              setCurrentSymbolIndex(p => p + 1);
              setActiveSymbol({ ...gameSymbols[currentSymbolIndex + 1], userDisplayI: userI, userDisplayQ: userQ });
            }, 800);
          } else {
            setTimeout(() => {
              setFeedback('MISSION COMPLETE!');
              setFinalScore(newScore);
              setGameActive(false);
              setIsMathUnlocked(true);
              silenceAudio();
            }, 800);
          }
        } else {
          setFeedback('MISMATCH'); setStreak(0);
          setTimeout(() => setFeedback(null), 800);
        }
      };

      // --- Grid Explorer Mouse Logic ---
      const handleExploreMouseMove = (e) => {
        if (!exploreCanvasRef.current) return;
        const rect = exploreCanvasRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // Canvas is 240x240. Center is 120,120. Scale is 30.
        const i = Math.round((x - 120) / 30);
        const q = Math.round((120 - y) / 30);

        const clamp = (val) => {
          if (val < -1.5) return -3;
          if (val < 0.5) return -1;
          if (val < 2.5) return 1;
          return 3;
        };

        setHoverI(clamp(i));
        setHoverQ(clamp(q));
      };

      // --- Scroll to Top on Tab Change ---
      useEffect(() => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, [activeTab, mathSubTab]);

      // --- Auto-advance Packet Journey WLAN Animation ---
      useEffect(() => {
        if (activeTab !== 'PACKET') return;
        const interval = setInterval(() => {
          setWlanStep((prev) => (prev + 1) % 4);
        }, 3200);
        return () => clearInterval(interval);
      }, [activeTab]);

      // --- Global Animation Loop ---
      useEffect(() => {
        let localLock = lockProgress;
        let localLocked = isPhaseLocked;

        const render = () => {
          if (!isWavePaused) {
            timeRef.current += 0.04;
          }
          const time = timeRef.current;

          // 0B. PACKET JOURNEY (WLAN / CELL TOWER CANVAS)
          if (activeTab === 'PACKET' && introCanvasRef.current) {
            const ctx = introCanvasRef.current.getContext('2d');
            const w = introCanvasRef.current.width, h = introCanvasRef.current.height;
            ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, w, h);

            const leftX = 85, rightX = w - 85, midY = h / 2 + 4;
            const waveStart = leftX + 45;
            const waveEnd = rightX - 45;
            const waveLen = waveEnd - waveStart;

            if (duplexMode === 'HALF') {
              // --- HALF-DUPLEX (Wi-Fi / Walkie-Talkie: 1 Shared Channel, Taking Turns) ---
              for (let r = 0; r < 3; r++) {
                const radius = ((time * 35 + r * 45) % 140) + 20;
                const alpha = Math.max(0, 1 - radius / 160) * 0.25;
                ctx.strokeStyle = wlanStep === 3 ? `rgba(34, 197, 94, ${alpha})` : `rgba(168, 85, 247, ${alpha})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(wlanStep === 3 ? rightX : leftX, midY, radius, -0.6, 0.6);
                ctx.stroke();
              }

              // Center Physical Medium Track
              ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
              ctx.beginPath(); ctx.moveTo(leftX + 40, midY); ctx.lineTo(rightX - 40, midY); ctx.stroke();
              ctx.setLineDash([]);

              // Symbol Boundary Marker
              ctx.strokeStyle = 'rgba(148, 163, 184, 0.25)'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
              ctx.beginPath(); ctx.moveTo(waveStart + waveLen / 2, midY - 38); ctx.lineTo(waveStart + waveLen / 2, midY + 38); ctx.stroke();
              ctx.setLineDash([]);

              // Modulated QAM Carrier Wave in the Air (with smooth pulse-shaped blending option)
              ctx.beginPath();
              ctx.strokeStyle = wlanStep === 3 ? '#22c55e' : '#a855f7';
              ctx.lineWidth = 2.5;
              const blendZone = 28; // Width of smooth pulse-shaping filter transition
              const halfLen = waveLen / 2;

              for (let x = 0; x <= waveLen; x++) {
                let blend = x < halfLen ? 0 : 1;
                if (smoothTransition && Math.abs(x - halfLen) < blendZone) {
                  const norm = (x - (halfLen - blendZone)) / (2 * blendZone);
                  blend = 0.5 - 0.5 * Math.cos(norm * Math.PI);
                }
                const iAmp = 3 * (1 - blend) + (-1) * blend;
                const qAmp = (-3) * (1 - blend) + 3 * blend;
                const t = (x * 0.07) - time * (wlanStep === 3 ? -2.2 : 2.2);
                const y = midY - (iAmp * Math.sin(t) + qAmp * Math.cos(t)) * 3.8;
                if (x === 0) ctx.moveTo(waveStart + x, y);
                else ctx.lineTo(waveStart + x, y);
              }
              ctx.stroke();

              // Moving Packet / Frame Box above the wave
              const progress = ((time * 0.4) % 1);
              const pktX = wlanStep === 3
                ? waveEnd - progress * (waveLen - 80) - 40
                : waveStart + progress * (waveLen - 80) + 40;
              const pktY = midY - 54;

              ctx.fillStyle = wlanStep === 3 ? '#064e3b' : '#1e1b4b';
              ctx.strokeStyle = wlanStep === 3 ? '#22c55e' : '#818cf8';
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.roundRect(pktX - 60, pktY - 13, 120, 24, 6);
              ctx.fill();
              ctx.stroke();

              ctx.font = 'bold 9px monospace';
              ctx.fillStyle = '#ffffff';
              ctx.textAlign = 'center';
              ctx.fillText(
                wlanStep === 3 ? '◀ ACK FRAME (1101)' : 'DATA: 1000 0110 ▶',
                pktX,
                pktY + 2
              );

              // Coordinate labels under wave
              ctx.font = '9px monospace';
              ctx.fillStyle = '#c084fc';
              ctx.fillText('Symbol 1: X=3, Y=-3 (1000)', waveStart + waveLen * 0.25, midY + 52);
              ctx.fillStyle = '#38bdf8';
              ctx.fillText('Symbol 2: X=-1, Y=3 (0110)', waveStart + waveLen * 0.75, midY + 52);

            } else {
              // --- FULL-DUPLEX (Cellular Tower / FDD: 2 Simultaneous Channels at Once!) ---
              const topY = midY - 28;
              const botY = midY + 28;

              // Center Channel Divider
              ctx.strokeStyle = '#334155'; ctx.lineWidth = 1; ctx.setLineDash([6, 4]);
              ctx.beginPath(); ctx.moveTo(waveStart, midY); ctx.lineTo(waveEnd, midY); ctx.stroke();
              ctx.setLineDash([]);

              // Top Lane: Downlink TX Wave (Purple, moving Left -> Right)
              ctx.beginPath();
              ctx.strokeStyle = '#a855f7';
              ctx.lineWidth = 2.2;
              const halfLen = waveLen / 2;
              const blendZone = 24;
              for (let x = 0; x <= waveLen; x++) {
                let blend = x < halfLen ? 0 : 1;
                if (smoothTransition && Math.abs(x - halfLen) < blendZone) {
                  const norm = (x - (halfLen - blendZone)) / (2 * blendZone);
                  blend = 0.5 - 0.5 * Math.cos(norm * Math.PI);
                }
                const iAmp = 3 * (1 - blend) + (-1) * blend;
                const qAmp = (-3) * (1 - blend) + 3 * blend;
                const t = (x * 0.07) - time * 2.2;
                const y = topY - (iAmp * Math.sin(t) + qAmp * Math.cos(t)) * 2.5;
                if (x === 0) ctx.moveTo(waveStart + x, y);
                else ctx.lineTo(waveStart + x, y);
              }
              ctx.stroke();

              // Bottom Lane: Uplink RX Wave (Green, moving Right -> Left simultaneously)
              ctx.beginPath();
              ctx.strokeStyle = '#22c55e';
              ctx.lineWidth = 2.2;
              for (let x = 0; x <= waveLen; x++) {
                let blend = x < halfLen ? 0 : 1;
                if (smoothTransition && Math.abs(x - halfLen) < blendZone) {
                  const norm = (x - (halfLen - blendZone)) / (2 * blendZone);
                  blend = 0.5 - 0.5 * Math.cos(norm * Math.PI);
                }
                const iAmp = 1 * (1 - blend) + 3 * blend;
                const qAmp = 3 * (1 - blend) + (-1) * blend;
                const t = (x * 0.085) + time * 2.2;
                const y = botY - (iAmp * Math.sin(t) + qAmp * Math.cos(t)) * 2.5;
                if (x === 0) ctx.moveTo(waveStart + x, y);
                else ctx.lineTo(waveStart + x, y);
              }
              ctx.stroke();

              // Simultaneous Moving Packets
              const prog = ((time * 0.4) % 1);
              const txPktX = waveStart + prog * (waveLen - 90) + 45;
              const rxPktX = waveEnd - prog * (waveLen - 90) - 45;

              ctx.textAlign = 'center';
              ctx.font = 'bold 8px monospace';

              // Top Packet
              ctx.fillStyle = '#1e1b4b'; ctx.strokeStyle = '#a855f7'; ctx.lineWidth = 1.2;
              ctx.beginPath(); ctx.roundRect(txPktX - 48, topY - 34, 96, 17, 4); ctx.fill(); ctx.stroke();
              ctx.fillStyle = '#e9d5ff';
              ctx.fillText('TX DATA (Ch A) ▶', txPktX, topY - 23);

              // Bottom Packet
              ctx.fillStyle = '#064e3b'; ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 1.2;
              ctx.beginPath(); ctx.roundRect(rxPktX - 48, botY + 18, 96, 17, 4); ctx.fill(); ctx.stroke();
              ctx.fillStyle = '#bbf7d0';
              ctx.fillText('◀ RX ACK/TELEM (Ch B)', rxPktX, botY + 29);
            }

            // Left Node Box (Router / Cell Tower)
            ctx.textAlign = 'center';
            ctx.fillStyle = '#1e293b'; ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.roundRect(14, midY - 38, 74, 76, 12); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#60a5fa'; ctx.font = 'bold 10px sans-serif';
            ctx.fillText(wlanScenario === 'ROUTER' ? 'Wi-Fi Router' : 'Cell / sUAS', 51, midY - 12);
            ctx.fillStyle = '#94a3b8'; ctx.font = '8px monospace';
            ctx.fillText(duplexMode === 'FULL' ? 'SIMULTANEOUS' : (wlanStep === 3 ? 'RECEIVING' : 'TRANSMITTING'), 51, midY + 4);
            ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 8px monospace';
            ctx.fillText('I·sin + Q·cos', 51, midY + 20);

            // Right Node Box (Smartphone / Drone)
            ctx.fillStyle = '#1e293b'; ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.roundRect(w - 88, midY - 38, 74, 76, 12); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#f87171'; ctx.font = 'bold 10px sans-serif';
            ctx.fillText(wlanScenario === 'ROUTER' ? 'Smartphone' : 'Drone / Phone', w - 51, midY - 12);
            ctx.fillStyle = '#94a3b8'; ctx.font = '8px monospace';
            ctx.fillText(duplexMode === 'FULL' ? 'SIMULTANEOUS' : (wlanStep === 3 ? 'SENDING ACK' : 'LISTENING'), w - 51, midY + 4);
            ctx.fillStyle = '#facc15'; ctx.font = 'bold 8px monospace';
            ctx.fillText('Demodulates', w - 51, midY + 20);

            ctx.textAlign = 'left';
          }

          // 1. FREQUENCY CANVAS
          if (activeTab === 'FREQ' && freqCanvasRef.current) {
            const ctx = freqCanvasRef.current.getContext('2d');
            const w = freqCanvasRef.current.width, h = freqCanvasRef.current.height;
            ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, w, h);

            const drawWave = (freqMultiplier, color, offset, label, dataRate) => {
              ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 2;
              for (let x = 0; x < w; x++) {
                const y = offset - 15 * Math.sin((x * 0.02 * freqMultiplier) - time * 2);
                if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
              }
              ctx.stroke();

              ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = '10px monospace';
              ctx.fillText(label, 10, offset - 20);

              if (dataRate) {
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.textAlign = 'right';
                ctx.fillText(`Capacity: ~${dataRate}`, w - 10, offset - 20);
                ctx.textAlign = 'left';
              }
            };

            const mult900 = 1.0 + ((freqValues.f900 - 902) / 26) * 0.2;
            const mult24  = 2.6 + ((freqValues.f24 - 2400) / 84) * 0.4;
            const mult52  = 5.6 + ((freqValues.f52 - 5150) / 100) * 0.4;
            const mult58  = 6.4 + ((freqValues.f58 - 5725) / 125) * 0.4;

            const rate900 = (1.5 + ((freqValues.f900 - 902) / 26) * 2).toFixed(1) + ' Mbps';
            const rate24  = (20 + ((freqValues.f24 - 2400) / 84) * 15).toFixed(1) + ' Mbps';
            const rate52  = (60 + ((freqValues.f52 - 5150) / 100) * 30).toFixed(1) + ' Mbps';
            const rate58  = (90 + ((freqValues.f58 - 5725) / 125) * 30).toFixed(1) + ' Mbps';

            if (showHopping) {
              const cycle = Math.floor(time * 2) % 4;
              ctx.fillStyle = 'rgba(239, 68, 68, 0.2)';
              ctx.fillRect(w/2 - 20, 0, 40, h);
              ctx.fillStyle = 'rgba(239, 68, 68, 0.5)'; ctx.fillText("INTERFERENCE", w/2 - 35, 20);

              const hoppingData = [
                { mult: mult900, color: '#22c55e', label: `Hop: ${freqValues.f900} MHz`, rate: rate900 },
                { mult: mult24,  color: '#3b82f6', label: `Hop: ${(freqValues.f24/1000).toFixed(4)} GHz`, rate: rate24 },
                { mult: mult52,  color: '#a855f7', label: `Hop: ${(freqValues.f52/1000).toFixed(3)} GHz`, rate: rate52 },
                { mult: mult58,  color: '#ef4444', label: `Hop: ${(freqValues.f58/1000).toFixed(3)} GHz`, rate: rate58 }
              ];
              drawWave(hoppingData[cycle].mult, hoppingData[cycle].color, h/2, hoppingData[cycle].label, hoppingData[cycle].rate);
            } else {
              drawWave(mult900, touchedFreqs.f900 ? '#22c55e' : '#334155', 40,  '900 MHz', touchedFreqs.f900 ? rate900 : '--- Mbps');
              drawWave(mult24,  touchedFreqs.f24 ? '#3b82f6' : '#334155', 90,  '2.4 GHz', touchedFreqs.f24 ? rate24 : '--- Mbps');
              drawWave(mult52,  touchedFreqs.f52 ? '#a855f7' : '#334155', 140, '5.2 GHz', touchedFreqs.f52 ? rate52 : '--- Mbps');
              drawWave(mult58,  touchedFreqs.f58 ? '#ef4444' : '#334155', 190, '5.8 GHz', touchedFreqs.f58 ? rate58 : '--- Mbps');
            }
          }

          // 2. SYNC / PLL CANVAS
          if (activeTab === 'SYNC' && syncPhase === 'PLL' && syncCanvasRef.current) {
            const ctx = syncCanvasRef.current.getContext('2d');
            const w = syncCanvasRef.current.width, h = syncCanvasRef.current.height, cy = h/2;
            ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, w, h);

            ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke();
            ctx.fillStyle = '#64748b'; ctx.font = '10px monospace';
            ctx.fillText('0V Centerline', 10, cy - 6);

            const diff = Math.abs(userFreq - targetFreq);
            if (diff < 2) localLock = Math.min(100, localLock + 1.5);
            else localLock = Math.max(0, localLock - 2);

            if (localLock >= 100 && !localLocked) { localLocked = true; setIsPhaseLocked(true); }
            else if (localLock < 100 && localLocked) { localLocked = false; setIsPhaseLocked(false); }
            setLockProgress(localLock);

            // Wave 1: Incoming Preamble Wave (Purple)
            ctx.strokeStyle = 'rgba(168, 85, 247, 0.9)'; ctx.lineWidth = 3; ctx.beginPath();
            for (let x = 0; x < w; x++) {
              const y = cy - 42 * Math.sin((x * (targetFreq * 0.0005)) - (time * (targetFreq / 18)));
              if (x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            }
            ctx.stroke();

            // Wave 2: User Local Oscillator Wave (Green)
            const activeFreq = localLocked ? targetFreq : userFreq;
            ctx.strokeStyle = localLocked ? '#22c55e' : 'rgba(34, 197, 94, 0.85)';
            ctx.lineWidth = localLocked ? 4 : 2.5;
            if (!localLocked) ctx.setLineDash([6, 4]);
            ctx.beginPath();
            for (let x = 0; x < w; x++) {
              const y = cy - 42 * Math.sin((x * (activeFreq * 0.0005)) - (time * (activeFreq / 18)));
              if (x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            }
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#c084fc'; ctx.font = 'bold 11px monospace';
            ctx.fillText(`● Incoming Preamble (${targetFreq} Hz)`, 12, 20);
            ctx.fillStyle = '#4ade80';
            ctx.fillText(`● Your Local Oscillator (${activeFreq} Hz)`, 260, 20);
          }

          // 2B. EXPLORER CANVAS
          if (activeTab === 'SYNC' && syncPhase === 'EXPLORE' && exploreCanvasRef.current) {
            const ctx = exploreCanvasRef.current.getContext('2d');
            const w = 240, h = 240, cx = 120, cy = 120, scale = 30;
            ctx.fillStyle = '#0f172a'; ctx.fillRect(0,0,w,h);

            ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
            for (let i = -3; i <= 3; i+=2) {
              ctx.beginPath(); ctx.moveTo(cx + i*scale, 0); ctx.lineTo(cx + i*scale, h); ctx.stroke();
              ctx.beginPath(); ctx.moveTo(0, cy - i*scale); ctx.lineTo(w, cy - i*scale); ctx.stroke();
            }
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#3b82f6'; ctx.beginPath(); ctx.moveTo(0,cy); ctx.lineTo(w,cy); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(w-8, cy-4); ctx.lineTo(w, cy); ctx.lineTo(w-8, cy+4); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(8, cy-4); ctx.lineTo(0, cy); ctx.lineTo(8, cy+4); ctx.stroke();

            ctx.strokeStyle = '#ef4444'; ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx,h); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx-4, 8); ctx.lineTo(cx, 0); ctx.lineTo(cx+4, 8); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx-4, h-8); ctx.lineTo(cx, h); ctx.lineTo(cx+4, h-8); ctx.stroke();

            for (let i = -3; i <= 3; i+=2) {
              for (let q = -3; q <= 3; q+=2) {
                ctx.fillStyle = (i === hoverI && q === hoverQ) ? '#a855f7' : 'rgba(255,255,255,0.2)';
                ctx.beginPath(); ctx.arc(cx + i*scale, cy - q*scale, (i === hoverI && q === hoverQ) ? 8 : 3, 0, 2*Math.PI);
                if (i === hoverI && q === hoverQ) { ctx.shadowBlur = 10; ctx.shadowColor = '#a855f7'; }
                ctx.fill(); ctx.shadowBlur = 0;
              }
            }
          }

          // 3. I/Q WAVES CANVAS
          if (activeTab === 'WAVES' && wavesGridRef.current && wavesOscRef.current) {
            const gridCtx = wavesGridRef.current.getContext('2d');
            const gW = wavesGridRef.current.width, gH = wavesGridRef.current.height;
            const cx = gW / 2, cy = gH / 2, scale = 28;
            gridCtx.fillStyle = '#0f172a'; gridCtx.fillRect(0,0,gW,gH);

            gridCtx.strokeStyle = '#1e293b'; gridCtx.lineWidth = 1;
            for (let i=-3; i<=3; i+=1) {
              gridCtx.beginPath(); gridCtx.moveTo(cx+i*scale, 0); gridCtx.lineTo(cx+i*scale, gH); gridCtx.stroke();
              gridCtx.beginPath(); gridCtx.moveTo(0, cy-i*scale); gridCtx.lineTo(gW, cy-i*scale); gridCtx.stroke();
            }

            gridCtx.lineWidth=2;
            gridCtx.strokeStyle='#3b82f6'; gridCtx.beginPath(); gridCtx.moveTo(0,cy); gridCtx.lineTo(gW,cy); gridCtx.stroke();
            gridCtx.beginPath(); gridCtx.moveTo(gW-8, cy-4); gridCtx.lineTo(gW, cy); gridCtx.lineTo(gW-8, cy+4); gridCtx.stroke();
            gridCtx.strokeStyle='#ef4444'; gridCtx.beginPath(); gridCtx.moveTo(cx,0); gridCtx.lineTo(cx,gH); gridCtx.stroke();
            gridCtx.beginPath(); gridCtx.moveTo(cx-4, 8); gridCtx.lineTo(cx, 0); gridCtx.lineTo(cx+4, 8); gridCtx.stroke();

            gridCtx.font = 'bold 11px monospace';
            gridCtx.fillStyle = '#60a5fa'; gridCtx.fillText('X (I)', gW - 34, cy - 8);
            gridCtx.fillStyle = '#f87171'; gridCtx.fillText('Y (Q)', cx + 8, 14);

            const tX = cx + wavesI*scale, tY = cy - wavesQ*scale;
            gridCtx.strokeStyle='rgba(255,255,255,0.25)'; gridCtx.setLineDash([4, 4]);
            gridCtx.beginPath(); gridCtx.moveTo(cx,cy); gridCtx.lineTo(tX,tY); gridCtx.stroke();
            gridCtx.setLineDash([]);

            gridCtx.strokeStyle='#3b82f6'; gridCtx.lineWidth=4; gridCtx.beginPath(); gridCtx.moveTo(cx,cy); gridCtx.lineTo(tX,cy); gridCtx.stroke();
            gridCtx.strokeStyle='#ef4444'; gridCtx.lineWidth=4; gridCtx.beginPath(); gridCtx.moveTo(tX,cy); gridCtx.lineTo(tX,tY); gridCtx.stroke();

            gridCtx.fillStyle='#a855f7'; gridCtx.beginPath(); gridCtx.arc(tX,tY,7,0,2*Math.PI); gridCtx.fill();
            gridCtx.fillStyle='#ffffff'; gridCtx.font='bold 10px monospace';
            gridCtx.fillText(`(${wavesI}, ${wavesQ})`, Math.min(gW - 45, Math.max(6, tX + 8)), Math.max(14, tY - 8));

            const waveCtx = wavesOscRef.current.getContext('2d');
            const wW = wavesOscRef.current.width, wH = wavesOscRef.current.height, wy = wH / 2;
            waveCtx.fillStyle = '#0f172a'; waveCtx.fillRect(0,0,wW,wH);
            waveCtx.strokeStyle = '#334155'; waveCtx.lineWidth = 1;
            waveCtx.beginPath(); waveCtx.moveTo(0,wy); waveCtx.lineTo(wW,wy); waveCtx.stroke();

            const drawSandboxWave = (amp, phase, color, lineWidth = 3) => {
              waveCtx.beginPath(); waveCtx.strokeStyle=color; waveCtx.lineWidth=lineWidth;
              for(let x=0; x<wW; x++) {
                const y = wy - (amp*14)*Math.sin((x*0.045)-time+phase);
                if(x===0) waveCtx.moveTo(x,y); else waveCtx.lineTo(x,y);
              }
              waveCtx.stroke();
            };

            drawSandboxWave(wavesI, 0, '#3b82f6', 3);
            drawSandboxWave(wavesQ, Math.PI/2, '#ef4444', 3);

            if (showCombinedPreview) {
              waveCtx.beginPath(); waveCtx.strokeStyle='rgba(168, 85, 247, 0.85)'; waveCtx.lineWidth=2;
              waveCtx.setLineDash([4, 4]);
              for(let x=0; x<wW; x++) {
                const y = wy - ((wavesI*14)*Math.sin((x*0.045)-time) + (wavesQ*14)*Math.sin((x*0.045)-time+Math.PI/2));
                if(x===0) waveCtx.moveTo(x,y); else waveCtx.lineTo(x,y);
              }
              waveCtx.stroke();
              waveCtx.setLineDash([]);
            }

            waveCtx.font = 'bold 10px monospace';
            waveCtx.fillStyle = '#60a5fa'; waveCtx.fillText(`● X (I) Sine Amp: ${wavesI}`, 8, 15);
            waveCtx.fillStyle = '#f87171'; waveCtx.fillText(`● Y (Q) Cosine Amp: ${wavesQ}`, 8, 29);
            if (showCombinedPreview) {
              waveCtx.fillStyle = '#c084fc'; waveCtx.fillText(`-- Combined (X+Y)`, 8, 43);
            }
          }

          // 4. TRANSMIT CANVAS
          if (activeTab === 'QAM' && gridCanvasRef.current && waveCanvasRef.current) {
            const gridCtx = gridCanvasRef.current.getContext('2d');
            const gW = 220, gH = 220, cx = 110, cy = 110, scale = 30;
            gridCtx.fillStyle = '#0f172a'; gridCtx.fillRect(0,0,gW,gH);
            gridCtx.strokeStyle = '#334155'; gridCtx.lineWidth=1;
            for (let i=-3; i<=3; i+=2) {
              gridCtx.beginPath(); gridCtx.moveTo(cx+i*scale, 0); gridCtx.lineTo(cx+i*scale, gH); gridCtx.stroke();
              gridCtx.beginPath(); gridCtx.moveTo(0, cy-i*scale); gridCtx.lineTo(gW, cy-i*scale); gridCtx.stroke();
            }
            gridCtx.lineWidth=2;
            gridCtx.strokeStyle='#3b82f6'; gridCtx.beginPath(); gridCtx.moveTo(0,cy); gridCtx.lineTo(gW,cy); gridCtx.stroke();
            gridCtx.beginPath(); gridCtx.moveTo(gW-8, cy-4); gridCtx.lineTo(gW, cy); gridCtx.lineTo(gW-8, cy+4); gridCtx.stroke();
            gridCtx.beginPath(); gridCtx.moveTo(8, cy-4); gridCtx.lineTo(0, cy); gridCtx.lineTo(8, cy+4); gridCtx.stroke();

            gridCtx.strokeStyle='#ef4444'; gridCtx.beginPath(); gridCtx.moveTo(cx,0); gridCtx.lineTo(cx,gH); gridCtx.stroke();
            gridCtx.beginPath(); gridCtx.moveTo(cx-4, 8); gridCtx.lineTo(cx, 0); gridCtx.lineTo(cx+4, 8); gridCtx.stroke();
            gridCtx.beginPath(); gridCtx.moveTo(cx-4, gH-8); gridCtx.lineTo(cx, gH); gridCtx.lineTo(cx+4, gH-8); gridCtx.stroke();

            let curI = activeSymbol ? (activeSymbol.userDisplayI !== undefined ? activeSymbol.userDisplayI : activeSymbol.i) : 0;
            let curQ = activeSymbol ? (activeSymbol.userDisplayQ !== undefined ? activeSymbol.userDisplayQ : activeSymbol.q) : 0;

            if (activeSymbol) {
              const tX = cx + curI*scale, tY = cy - curQ*scale;
              gridCtx.strokeStyle='rgba(255,255,255,0.2)'; gridCtx.beginPath(); gridCtx.moveTo(cx,cy); gridCtx.lineTo(tX,tY); gridCtx.stroke();
              gridCtx.fillStyle='#3b82f6'; gridCtx.beginPath(); gridCtx.arc(tX,cy,5,0,2*Math.PI); gridCtx.fill();
              gridCtx.fillStyle='#ef4444'; gridCtx.beginPath(); gridCtx.arc(cx,tY,5,0,2*Math.PI); gridCtx.fill();
              gridCtx.fillStyle='#a855f7'; gridCtx.beginPath(); gridCtx.arc(tX,tY,8,0,2*Math.PI); gridCtx.fill();
            }

            const waveCtx = waveCanvasRef.current.getContext('2d');
            const wW = 320, wH = 220, wy = 110;
            waveCtx.fillStyle = '#0f172a'; waveCtx.fillRect(0,0,wW,wH);
            waveCtx.strokeStyle = '#334155'; waveCtx.beginPath(); waveCtx.moveTo(0,wy); waveCtx.lineTo(wW,wy); waveCtx.stroke();

            if (activeSymbol) {
              const drawW = (amp, phase, color, w) => {
                waveCtx.beginPath(); waveCtx.strokeStyle=color; waveCtx.lineWidth=w;
                for(let x=0; x<wW; x++) {
                  const y = wy - (amp*12)*Math.sin((x*0.05)-time+phase);
                  if(x===0) waveCtx.moveTo(x,y); else waveCtx.lineTo(x,y);
                }
                waveCtx.stroke();
              };
              drawW(curI, 0, 'rgba(59,130,246,0.6)', 2);
              drawW(curQ, Math.PI/2, 'rgba(239,68,68,0.6)', 2);
              waveCtx.beginPath(); waveCtx.strokeStyle='#a855f7'; waveCtx.lineWidth=3;
              for(let x=0; x<wW; x++) {
                const y = wy - ((curI*12)*Math.sin((x*0.05)-time) + (curQ*12)*Math.sin((x*0.05)-time+Math.PI/2));
                if(x===0) waveCtx.moveTo(x,y); else waveCtx.lineTo(x,y);
              }
              waveCtx.stroke();
            }
          }

          // 5. MATH DEMODULATOR CANVAS
          if (activeTab === 'MATH' && mathSubTab === 'SIMULATOR' && mathTopRef.current && mathMidRef.current && mathBotRef.current) {
            const w = 400, h = 115, cy = 58;
            const topCtx = mathTopRef.current.getContext('2d');
            const midCtx = mathMidRef.current.getContext('2d');
            const botCtx = mathBotRef.current.getContext('2d');
            const isSine = demodRefType === 'SINE';

            [topCtx, midCtx, botCtx].forEach(ctx => {
              ctx.fillStyle = '#0f172a'; ctx.fillRect(0,0,w,h);
              ctx.strokeStyle = '#475569'; ctx.lineWidth=1;
              ctx.beginPath(); ctx.moveTo(0,cy); ctx.lineTo(w,cy); ctx.stroke();
              ctx.fillStyle = '#64748b'; ctx.font = '9px monospace';
              ctx.fillText('0V Centerline', w - 78, cy - 4);
            });

            if (showHiddenIngredients) {
              topCtx.beginPath(); topCtx.strokeStyle='rgba(59, 130, 246, 0.55)'; topCtx.lineWidth=1.5; topCtx.setLineDash([4, 4]);
              for(let x=0; x<w; x++) {
                const t = (x*0.05)-time;
                const y = cy - (demodI * Math.sin(t) * 8);
                if(x===0) topCtx.moveTo(x,y); else topCtx.lineTo(x,y);
              }
              topCtx.stroke();

              topCtx.beginPath(); topCtx.strokeStyle='rgba(239, 68, 68, 0.55)'; topCtx.lineWidth=1.5;

                const t = (x*0.05)-time;
                const y = cy - (demodQ * Math.cos(t) * 8);
                if(x===0) topCtx.moveTo(x,y); else topCtx.lineTo(x,y);
              }
              topCtx.stroke();
              topCtx.setLineDash([]);

              const t = (x*0.05)-time;
              const val = demodI*Math.sin(t) + demodQ*Math.cos(t);
              const y = cy - (val*8);
              if(x===0) topCtx.moveTo(x,y); else topCtx.lineTo(x,y);
            }
            topCtx.stroke();

            topCtx.font = 'bold 10px monospace';
            topCtx.fillStyle = '#c084fc';
            topCtx.fillText(`● Graph 1 Formula: (${demodI})·sin(t) + (${demodQ})·cos(t)`, 8, 14);
            if (showHiddenIngredients) {
              topCtx.fillStyle = '#60a5fa'; topCtx.fillText(`-- Blue: X=${demodI}·sin(t)`, 8, h - 8);
              topCtx.fillStyle = '#f87171'; topCtx.fillText(`-- Red: Y=${demodQ}·cos(t)`, 155, h - 8);

            midCtx.beginPath();
            midCtx.strokeStyle = isSine ? '#3b82f6' : '#ef4444';
            midCtx.lineWidth=2.5;
            for(let x=0; x<w; x++) {
              const t = (x*0.05)-time;
              const val = isSine ? 2*Math.sin(t) : 2*Math.cos(t);
              const y = cy - (val*12);
              if(x===0) midCtx.moveTo(x,y); else midCtx.lineTo(x,y);

            midCtx.stroke();

            midCtx.font = 'bold 10px monospace';
            midCtx.fillStyle = isSine ? '#60a5fa' : '#f87171';
            midCtx.fillText(
              isSine ? '● Graph 2 Formula: 2·sin(t) [Extracts Blue X]' : '● Graph 2 Formula: 2·cos(t) [Extracts Red Y]',

            const avgY = cy - (targetAverage*6);

            botCtx.fillStyle = isSine ? 'rgba(59, 130, 246, 0.15)' : 'rgba(239, 68, 68, 0.15)';
            botCtx.fillRect(0, Math.min(cy, avgY), w, Math.abs(avgY - cy));

            botCtx.beginPath(); botCtx.strokeStyle = isSine ? '#3b82f6' : '#ef4444'; botCtx.lineWidth=2;
            for(let x=0; x<w; x++) {
              const t = (x*0.05)-time;
              const purpleVal = demodI*Math.sin(t) + demodQ*Math.cos(t);
              const refVal = isSine ? 2*Math.sin(t) : 2*Math.cos(t);
              const product = purpleVal * refVal;
              const y = cy - (product*6);
              if(x===0) botCtx.moveTo(x,y); else botCtx.lineTo(x,y);
            }
            botCtx.stroke();

            botCtx.beginPath(); botCtx.strokeStyle='#facc15'; botCtx.lineWidth=2; botCtx.setLineDash([6, 4]);
            botCtx.moveTo(0, avgY); botCtx.lineTo(w, avgY); botCtx.stroke(); botCtx.setLineDash([]);

            botCtx.fillStyle = isSine ? '#93c5fd' : '#fca5a5';

              mCtx.fillStyle = '#0f172a'; mCtx.fillRect(0, 0, mW, mH);

              mCtx.strokeStyle = '#1e293b'; mCtx.lineWidth = 1;
              for (let i = -3; i <= 3; i += 2) {
                mCtx.beginPath(); mCtx.moveTo(mCx + i * mScale, 0); mCtx.lineTo(mCx + i * mScale, mH); mCtx.stroke();
                mCtx.beginPath(); mCtx.moveTo(0, mCy - i * mScale); mCtx.lineTo(mW, mCy - i * mScale); mCtx.stroke();
              }

              mCtx.strokeStyle = '#3b82f6'; mCtx.lineWidth = 1.5;
              mCtx.beginPath(); mCtx.moveTo(0, mCy); mCtx.lineTo(mW, mCy); mCtx.stroke();
              mCtx.strokeStyle = '#ef4444'; mCtx.lineWidth = 1.5;
              mCtx.beginPath(); mCtx.moveTo(mCx, 0); mCtx.lineTo(mCx, mH); mCtx.stroke();

                mCtx.beginPath(); mCtx.moveTo(0, ptY); mCtx.lineTo(mW, ptY); mCtx.stroke();

              mCtx.strokeStyle = '#ffffff'; mCtx.lineWidth = 1.5; mCtx.stroke();
            }
          }

          animationRef.current = requestAnimationFrame(render);
        };

        return () => cancelAnimationFrame(animationRef.current);

                    </div>

                    {/* WHY DON'T WE SUBTRACT CALLOUT */}
                    <div className="bg-amber-50 border-l-4 border-amber-500 p-5 rounded-r-xl shadow-sm">
                      <h3 className="text-sm font-black text-amber-900 flex items-center gap-2 mb-1">
                        <HelpCircle className="w-5 h-5 text-amber-600 flex-shrink-0" />
                        Wait—If the Transmitter ADDED the two waves, why don't we just SUBTRACT to undo it?
                      </h3>
                      <p className="text-xs text-amber-900 leading-relaxed">
                        In normal algebra, if <code className="font-bold">X + Y = Purple</code>, you would find <code className="font-bold">X</code> by subtracting <code className="font-bold">Y</code> (<code className="font-bold">X = Purple - Y</code>). <strong>But at the receiver antenna, both X and Y are secret unknowns!</strong> The receiver only catches the single combined Purple wave from the air—it has no idea that <code className="font-bold">Y = {demodQ}</code>, so it doesn't know how much Red Cosine wave to subtract!
                        <br /><br />
                        Instead, thanks to the PLL synchronization from Lab 2, the receiver <em>does</em> know the exact timing of a pure <code className="font-bold">sin(t)</code> and <code className="font-bold">cos(t)</code> wave. By <strong>multiplying</strong> the incoming wave by <code className="font-bold">2·{demodRefType === 'SINE' ? 'sin(t)' : 'cos(t)'}</code> and taking the average over one cycle, the unwanted 90°-shifted wave automatically averages out to <strong>zero</strong> no matter what number was multiplying it!
                      </p>
                    </div>

                    {/* STEP-BY-STEP BY HAND TABLE */}
                    <div className="space-y-3">
                      {/* STEP 1 */}
                      <div className="grid grid-cols-1 md:grid-cols-12 bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                        <div className="md:col-span-7 p-4 bg-slate-900 text-white font-mono text-xs sm:text-sm flex flex-col justify-center">
                          <div className="text-[10px] text-slate-400 uppercase tracking-widest mb-1">Step 1: Plug Numbers into the 2 Wave Equations</div>
                          <div className="text-blue-400 font-bold">Equation 1 (Blue X Wave) = {demodI} · sin(t)</div>
                          <div className="text-red-400 font-bold mt-1">Equation 2 (Red Y Wave)  = {demodQ} · cos(t)</div>
                        </div>
                        <div className="md:col-span-5 p-4 text-xs text-slate-600 flex items-center bg-slate-50">
                          <span><strong>Explanation:</strong> At the transmitter, we plug your chosen coordinates (<strong>X = {demodI}</strong> and <strong>Y = {demodQ}</strong>) in as the amplitudes (heights) of two separate waves: a Sine wave and a Cosine wave.</span>
                        </div>
                      </div>

                      {/* STEP 2 */}
                      <div className="grid grid-cols-1 md:grid-cols-12 bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                        <div className="md:col-span-7 p-4 bg-slate-900 text-white font-mono text-xs sm:text-sm flex flex-col justify-center">

                          </div>
                        </div>
                        <div className="md:col-span-5 p-4 text-xs text-slate-600 flex items-center bg-slate-50">
                          <span><strong>Explanation:</strong> The antenna adds both equations together into a single combined radio wave (<strong>Graph 1</strong>) and sends it across the air to the receiver.</span>
                        </div>
                      </div>

                      {/* STEP 3 */}
                      <div className="grid grid-cols-1 md:grid-cols-12 bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                        <div className="md:col-span-7 p-4 bg-slate-900 text-white font-mono text-xs sm:text-sm flex flex-col justify-center">
                          <div className="text-[10px] text-yellow-400 uppercase tracking-widest mb-1">

                          </div>
                          <div className="text-slate-300 mt-1 text-xs">
                            {demodRefType === 'SINE'
                              ? `= (${demodI}) · 2sin²(t)  +  (${demodQ}) · 2sin(t)cos(t)`
                              : `= (${demodI}) · 2sin(t)cos(t)  +  (${demodQ}) · 2cos²(t)`}
                          </div>
                        </div>
                        <div className="md:col-span-5 p-4 text-xs text-slate-600 flex items-center bg-slate-50">
                          <span>
                            <strong>Explanation:</strong> To solve for <strong>{demodRefType === 'SINE' ? 'X' : 'Y'}</strong>, the receiver multiplies the entire incoming wave by <strong>Graph 2 ({demodRefType === 'SINE' ? '2·sin(t)' : '2·cos(t)'})</strong> and distributes the multiplication across both terms.
                          </span>
                        </div>
                      </div>

                      {/* STEP 4: SOLVE AT 4 COMPASS POINTS BY HAND */}
                      <div className="grid grid-cols-1 md:grid-cols-12 bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                        <div className="md:col-span-7 p-4 bg-slate-900 text-white font-mono text-xs flex flex-col justify-center">
                          <div className="text-[10px] text-emerald-400 uppercase tracking-widest mb-2">
                            Step 4: Plug In 4 Points Around 1 Wave Cycle (0°, 90°, 180°, 270°)

                              const g1 = demodI * pt.s + demodQ * pt.c;
                              const g2 = demodRefType === 'SINE' ? 2 * pt.s : 2 * pt.c;
                              const prod = g1 * g2;

                                  <div className="text-[10px] text-slate-400">{pt.deg}</div>

                                  <div className={`text-[10px] ${demodRefType === 'SINE' ? 'text-blue-400' : 'text-red-400'}`}>× G2 = {g2}</div>
                                  <div className="border-t border-slate-600 mt-1 pt-1 font-black text-yellow-400">
                                    = {prod}
                                  </div>
                                </div>

                          </div>
                        </div>
                        <div className="md:col-span-5 p-4 text-xs text-slate-600 flex items-center bg-slate-50">
                          <span>
                            <strong>Explanation:</strong> Look at what happens at the 4 quarter-cycle points! Because <code className="font-bold">sin</code> and <code className="font-bold">cos</code> take turns being <code className="font-bold">0</code>, the unwanted coordinate is multiplied by <code className="font-bold">0</code>, while the target coordinate gets multiplied by <code className="font-bold">+2</code> and <code className="font-bold">-2</code> (and a negative times a negative becomes positive!).
