  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Inline Lucide-compatible 24x24 SVG Icon Components
    const createIcon = (children) => ({ className = "w-4 h-4", ...props }) => (
      <svg
        xmlns="http://www.w3.org/2000/svg"

    );

    const Play = createIcon(<polygon points="6 3 20 12 6 21 6 3" />);
    const Square = createIcon(<rect width="18" height="18" x="3" y="3" rx="2" />);
    const Settings = createIcon(<>
      <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
      <circle cx="12" cy="12" r="3" />

    const Unlock = createIcon(<>

    const Radio = createIcon(<>

    </>);
    const Activity = createIcon(<path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2" />);
    const Target = createIcon(<>
      <circle cx="12" cy="12" r="10" />
      <circle cx="12" cy="12" r="6" />
      <circle cx="12" cy="12" r="2" />
    </>);
    const Trophy = createIcon(<>
      <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
      <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />

      <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
      <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
    </>);
    const Award = createIcon(<>
      <path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526" />
      <circle cx="12" cy="8" r="6" />
    </>);
    const FileSignature = createIcon(<>
      <path d="M20 19.5v.5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8.5L18 5.5" />
      <path d="M8 18h1" />
      <path d="M18.42 9.61a2.1 2.1 0 1 1 2.97 2.97L16.95 17 13 18l.99-3.95 4.43-4.44Z" />
    </>);
    const Info = createIcon(<>
      <circle cx="12" cy="12" r="10" />
      <path d="M12 16v-4" />
      <path d="M12 8h.01" />
    </>);
    const BookOpen = createIcon(<>
      <path d="M12 7v14" />
      <path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z" />
    </>);
    const Calculator = createIcon(<>
      <rect width="16" height="20" x="4" y="2" rx="2" />
      <line x1="8" x2="16" y1="6" y2="6" />
      <line x1="16" x2="16" y1="14" y2="18" />
      <path d="M16 10h.01" />
      <path d="M12 10h.01" />
      <path d="M8 10h.01" />
      <path d="M12 14h.01" />
      <path d="M8 14h.01" />
      <path d="M12 18h.01" />
      <path d="M8 18h.01" />
    </>);

    function App() {
      // --- Global State ---
      const [activeTab, setActiveTab] = useState('SYNC');
      const [isUnlocked, setIsUnlocked] = useState(false);
      const [isMathUnlocked, setIsMathUnlocked] = useState(false);
      const [certUnlocked, setCertUnlocked] = useState(false);

      // --- Tab 1: Sync & Explorer State ---
      const [syncPhase, setSyncPhase] = useState('PLL'); // 'PLL' or 'EXPLORE'
      const [userFreq, setUserFreq] = useState(20);
      const [lockProgress, setLockProgress] = useState(0);
      const [isPhaseLocked, setIsPhaseLocked] = useState(false);
      const targetFreq = 50;
      
      const [hoverI, setHoverI] = useState(-3);
      const [hoverQ, setHoverQ] = useState(3);

      // --- Tab 2: QAM Transmit State ---
      const [qamMode, setQamMode] = useState('MANUAL'); 
      const [status, setStatus] = useState('Ready to transmit');
      const [activeSymbol, setActiveSymbol] = useState(null);
      const [gameActive, setGameActive] = useState(false);
      const [targetWord, setTargetWord] = useState('RF');
      const [gameSymbols, setGameSymbols] = useState([]);
      const [currentSymbolIndex, setCurrentSymbolIndex] = useState(0);
      const [userI, setUserI] = useState(-3);
      const [userQ, setUserQ] = useState(-3);
      const [score, setScore] = useState(0);
      const [streak, setStreak] = useState(0);
      const [feedback, setFeedback] = useState(null);
      const [finalScore, setFinalScore] = useState(0);
      const [inputText, setInputText] = useState('WIFI');
      const [isPlaying, setIsPlaying] = useState(false);
      const isTransmittingRef = useRef(false);

      // --- Tab 3: Demodulator Math State ---
      const [demodI, setDemodI] = useState(3);
      const [demodQ, setDemodQ] = useState(-1);
      const [demodRefType, setDemodRefType] = useState('SINE'); // 'SINE' (I-axis) or 'COSINE' (Q-axis)

      // --- Tab 4/5: Certificate State ---
      const [studentName, setStudentName] = useState('');
      const [certHash] = useState(() => Math.random().toString(36).substring(2, 10).toUpperCase());

      // --- Refs ---
      const audioCtxRef = useRef(null);
      const gainIRef = useRef(null);
      const gainQRef = useRef(null);
      
      const syncCanvasRef = useRef(null);
      const exploreCanvasRef = useRef(null);
      const gridCanvasRef = useRef(null);
      const waveCanvasRef = useRef(null);
      
      const mathTopRef = useRef(null);
      const mathMidRef = useRef(null);
      const mathBotRef = useRef(null);
      
      const animationRef = useRef(null);

      // --- Core QAM Logic & Audio ---
      const initAudio = () => {
        if (!audioCtxRef.current) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          audioCtxRef.current = new Ctx();
          const masterGain = audioCtxRef.current.createGain();
          masterGain.gain.value = 0.2; 
          masterGain.connect(audioCtxRef.current.destination);

          const oscI = audioCtxRef.current.createOscillator();
          oscI.type = 'sine'; oscI.frequency.value = 300; 
          gainIRef.current = audioCtxRef.current.createGain();
          gainIRef.current.gain.value = 0;
          oscI.connect(gainIRef.current).connect(masterGain);
          oscI.start();

          const oscQ = audioCtxRef.current.createOscillator();
          oscQ.type = 'sine'; oscQ.frequency.value = 600; 
          gainQRef.current = audioCtxRef.current.createGain();
          gainQRef.current.gain.value = 0;
          oscQ.connect(gainQRef.current).connect(masterGain);
          oscQ.start();
        }
        if (audioCtxRef.current.state === 'suspended') audioCtxRef.current.resume();
      };

      const updateAudioGains = (iVal, qVal) => {
        if (!audioCtxRef.current || !gainIRef.current) return;
        const volI = (iVal + 4) / 7;
        const volQ = (qVal + 4) / 7;
        gainIRef.current.gain.setTargetAtTime(volI, audioCtxRef.current.currentTime, 0.05);
        gainQRef.current.gain.setTargetAtTime(volQ, audioCtxRef.current.currentTime, 0.05);
      };

      const silenceAudio = () => {
        if (gainIRef.current && audioCtxRef.current) {
          gainIRef.current.gain.setTargetAtTime(0, audioCtxRef.current.currentTime, 0.05);
          gainQRef.current.gain.setTargetAtTime(0, audioCtxRef.current.currentTime, 0.05);
        }
      };

      const bitsMap = {'-3': '00', '-1': '01', '1': '11', '3': '10'};
      
      const convertTextToSymbols = (text) => {
        const symbols = [];
        for (let i = 0; i < text.length; i++) {
          const char = text[i];
          const binary = char.charCodeAt(0).toString(2).padStart(8, '0');
          const b1 = binary.substring(0, 2);
          const b2 = binary.substring(2, 4);
          const b3 = binary.substring(4, 6);
          const b4 = binary.substring(6, 8);
          
          const getCoord = (b) => b === '00' ? -3 : b === '01' ? -1 : b === '11' ? 1 : 3;
          
          symbols.push({ char, bits: b1+b2, i: getCoord(b1), q: getCoord(b2) });
          symbols.push({ char, bits: b3+b4, i: getCoord(b3), q: getCoord(b4) });
        }
        return symbols;
      };

      // --- Auto / Manual Game Logic ---
      const startAutoTransmission = async () => {
        initAudio();
        setIsPlaying(true);
        isTransmittingRef.current = true;
        
        const symbols = convertTextToSymbols(inputText || ' ');
        setStatus(`Auto-Transmitting Text...`);

        for (let i = 0; i < symbols.length; i++) {
          if (!isTransmittingRef.current) break;
          setActiveSymbol(symbols[i]);
          updateAudioGains(symbols[i].i, symbols[i].q);
          await new Promise(r => setTimeout(r, 1500));
        }

        if (isTransmittingRef.current) {
          isTransmittingRef.current = false;
          setIsPlaying(false);
          setActiveSymbol(null);
          setStatus('Transmission Complete');
          setIsMathUnlocked(true);
          silenceAudio();
        }
      };

      const stopAutoTransmission = () => {
        isTransmittingRef.current = false;
        setIsPlaying(false);
        setActiveSymbol(null);
        setStatus('Transmission Stopped');
        silenceAudio();
      };

      const stopGame = () => {
        setGameActive(false);
        setActiveSymbol(null);
        setStatus('Ready to transmit');
        silenceAudio();
      };

      const startGame = () => {
        initAudio();
        const wordToUse = targetWord.trim() || 'RF';
        const symbols = convertTextToSymbols(wordToUse);
        setGameSymbols(symbols);
        setCurrentSymbolIndex(0);
        setScore(0);
        setStreak(0);
        setUserI(-3); setUserQ(-3);
        setActiveSymbol(symbols[0]);
        updateAudioGains(-3, -3); 
        setGameActive(true);
        setFeedback(null);
        setStatus('Manual Link Active');
      };

      const handleSliderChange = (axis, val) => {
        initAudio();
        const newVal = Number(val);
        let nextI = axis === 'I' ? newVal : userI;
        let nextQ = axis === 'Q' ? newVal : userQ;
        if (axis === 'I') setUserI(newVal); else setUserQ(newVal);
        updateAudioGains(nextI, nextQ);
        if (gameActive && gameSymbols[currentSymbolIndex]) {
          setActiveSymbol({ ...gameSymbols[currentSymbolIndex], userDisplayI: nextI, userDisplayQ: nextQ });
        }
      };

      const transmitManualSymbol = () => {
        const cur = gameSymbols[currentSymbolIndex];
        if (!cur) return;
        if (userI === cur.i && userQ === cur.q) {
          setFeedback('CORRECT');
          const newScore = score + 100 + (streak * 20);
          setScore(newScore); setStreak(s => s + 1);
          
          if (currentSymbolIndex + 1 < gameSymbols.length) {
            setTimeout(() => {
              setFeedback(null);
              setCurrentSymbolIndex(p => p + 1);
              setActiveSymbol({ ...gameSymbols[currentSymbolIndex + 1], userDisplayI: userI, userDisplayQ: userQ });
            }, 800);
          } else {
            setTimeout(() => {
              setFeedback('MISSION COMPLETE!');
              setFinalScore(newScore);
              setGameActive(false);
              setIsMathUnlocked(true);
              silenceAudio();
            }, 800);
          }
        } else {
          setFeedback('MISMATCH'); setStreak(0);
          setTimeout(() => setFeedback(null), 800);
        }
      };

      // --- Grid Explorer Mouse Logic ---
      const handleExploreMouseMove = (e) => {
        if (!exploreCanvasRef.current) return;
        const rect = exploreCanvasRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        // Canvas is 240x240. Center is 120,120. Scale is 30.
        const i = Math.round((x - 120) / 30);
        const q = Math.round((120 - y) / 30);
        
        const clamp = (val) => {
          if (val < -1.5) return -3;
          if (val < 0.5) return -1;
          if (val < 2.5) return 1;
          return 3;
        };
        
        setHoverI(clamp(i));
        setHoverQ(clamp(q));
      };

      // --- Global Animation Loop ---
      useEffect(() => {
        let time = 0;
        let localLock = lockProgress;
        let localLocked = isPhaseLocked;

        const render = () => {
          time += 0.05;

          // 1. SYNC / PLL CANVAS
          if (activeTab === 'SYNC' && syncPhase === 'PLL' && syncCanvasRef.current) {
            const ctx = syncCanvasRef.current.getContext('2d');
            const w = syncCanvasRef.current.width, h = syncCanvasRef.current.height, cy = h/2;
            ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, w, h);
            ctx.strokeStyle = '#334155'; ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke();
            
            const diff = Math.abs(userFreq - targetFreq);
            if (diff < 2) localLock = Math.min(100, localLock + 1);
            else localLock = Math.max(0, localLock - 2);
            
            if (localLock >= 100 && !localLocked) { localLocked = true; setIsPhaseLocked(true); setIsUnlocked(true); } 
            else if (localLock < 100 && localLocked) { localLocked = false; setIsPhaseLocked(false); }
            setLockProgress(localLock);

            ctx.strokeStyle = 'rgba(168, 85, 247, 0.8)'; ctx.lineWidth = 3; ctx.beginPath();
            for (let x = 0; x < w; x++) {
              const y = cy - 40 * Math.sin((x*0.02) - (time*(targetFreq/10)));
              if (x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            }
            ctx.stroke();

            ctx.strokeStyle = localLocked ? '#22c55e' : 'rgba(34, 197, 94, 0.6)'; ctx.lineWidth = localLocked ? 4 : 2; ctx.beginPath();
            const activeFreq = localLocked ? targetFreq : userFreq;
            for (let x = 0; x < w; x++) {
              const y = cy - 40 * Math.sin((x*0.02) - (time*(activeFreq/10)));
              if (x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            }
            ctx.stroke();
          }

          // 1B. EXPLORER CANVAS
          if (activeTab === 'SYNC' && syncPhase === 'EXPLORE' && exploreCanvasRef.current) {
            const ctx = exploreCanvasRef.current.getContext('2d');
            const w = 240, h = 240, cx = 120, cy = 120, scale = 30;
            ctx.fillStyle = '#0f172a'; ctx.fillRect(0,0,w,h);
            
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
            for (let i = -3; i <= 3; i+=2) {
              ctx.beginPath(); ctx.moveTo(cx + i*scale, 0); ctx.lineTo(cx + i*scale, h); ctx.stroke();
              ctx.beginPath(); ctx.moveTo(0, cy - i*scale); ctx.lineTo(w, cy - i*scale); ctx.stroke();
            }
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#3b82f6'; ctx.beginPath(); ctx.moveTo(0,cy); ctx.lineTo(w,cy); ctx.stroke();
            ctx.strokeStyle = '#ef4444'; ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx,h); ctx.stroke();

            for (let i = -3; i <= 3; i+=2) {
              for (let q = -3; q <= 3; q+=2) {
                ctx.fillStyle = (i === hoverI && q === hoverQ) ? '#a855f7' : 'rgba(255,255,255,0.2)';
                ctx.beginPath(); ctx.arc(cx + i*scale, cy - q*scale, (i === hoverI && q === hoverQ) ? 8 : 3, 0, 2*Math.PI); 
                if (i === hoverI && q === hoverQ) { ctx.shadowBlur = 10; ctx.shadowColor = '#a855f7'; }
                ctx.fill(); ctx.shadowBlur = 0;
              }
            }
          }

          // 2. TRANSMIT CANVAS
          if (activeTab === 'QAM' && gridCanvasRef.current && waveCanvasRef.current) {
            // Grid
            const gridCtx = gridCanvasRef.current.getContext('2d');
            const gW = 220, gH = 220, cx = 110, cy = 110, scale = 30;
            gridCtx.fillStyle = '#0f172a'; gridCtx.fillRect(0,0,gW,gH);
            gridCtx.strokeStyle = '#334155'; gridCtx.lineWidth=1;
            for (let i=-3; i<=3; i+=2) {
              gridCtx.beginPath(); gridCtx.moveTo(cx+i*scale, 0); gridCtx.lineTo(cx+i*scale, gH); gridCtx.stroke();
              gridCtx.beginPath(); gridCtx.moveTo(0, cy-i*scale); gridCtx.lineTo(gW, cy-i*scale); gridCtx.stroke();
            }
            gridCtx.lineWidth=2; gridCtx.strokeStyle='#3b82f6'; gridCtx.beginPath(); gridCtx.moveTo(0,cy); gridCtx.lineTo(gW,cy); gridCtx.stroke();
            gridCtx.strokeStyle='#ef4444'; gridCtx.beginPath(); gridCtx.moveTo(cx,0); gridCtx.lineTo(cx,gH); gridCtx.stroke();

            let curI = activeSymbol ? (activeSymbol.userDisplayI !== undefined ? activeSymbol.userDisplayI : activeSymbol.i) : 0;
            let curQ = activeSymbol ? (activeSymbol.userDisplayQ !== undefined ? activeSymbol.userDisplayQ : activeSymbol.q) : 0;

            if (activeSymbol) {
              const tX = cx + curI*scale, tY = cy - curQ*scale;
              gridCtx.strokeStyle='rgba(255,255,255,0.2)'; gridCtx.beginPath(); gridCtx.moveTo(cx,cy); gridCtx.lineTo(tX,tY); gridCtx.stroke();
              gridCtx.fillStyle='#3b82f6'; gridCtx.beginPath(); gridCtx.arc(tX,cy,5,0,2*Math.PI); gridCtx.fill();
              gridCtx.fillStyle='#ef4444'; gridCtx.beginPath(); gridCtx.arc(cx,tY,5,0,2*Math.PI); gridCtx.fill();
              gridCtx.fillStyle='#a855f7'; gridCtx.beginPath(); gridCtx.arc(tX,tY,8,0,2*Math.PI); gridCtx.fill();
            }

            // Wave
            const waveCtx = waveCanvasRef.current.getContext('2d');
            const wW = 320, wH = 220, wy = 110;
            waveCtx.fillStyle = '#0f172a'; waveCtx.fillRect(0,0,wW,wH);
            waveCtx.strokeStyle = '#334155'; waveCtx.beginPath(); waveCtx.moveTo(0,wy); waveCtx.lineTo(wW,wy); waveCtx.stroke();

            if (activeSymbol) {
              const drawW = (amp, phase, color, w) => {
                waveCtx.beginPath(); waveCtx.strokeStyle=color; waveCtx.lineWidth=w;
                for(let x=0; x<wW; x++) {
                  const y = wy - (amp*12)*Math.sin((x*0.05)-time+phase);
                  if(x===0) waveCtx.moveTo(x,y); else waveCtx.lineTo(x,y);
                }
                waveCtx.stroke();
              };
              drawW(curI, 0, 'rgba(59,130,246,0.6)', 1.5);
              drawW(curQ, Math.PI/2, 'rgba(239,68,68,0.6)', 1.5);
              waveCtx.beginPath(); waveCtx.strokeStyle='#a855f7'; waveCtx.lineWidth=3;
              for(let x=0; x<wW; x++) {
                const y = wy - ((curI*12)*Math.sin((x*0.05)-time) + (curQ*12)*Math.sin((x*0.05)-time+Math.PI/2));
                if(x===0) waveCtx.moveTo(x,y); else waveCtx.lineTo(x,y);
              }
              waveCtx.stroke();
            }
          }

          // 3. MATH DEMODULATOR CANVAS
          if (activeTab === 'MATH' && mathTopRef.current && mathMidRef.current && mathBotRef.current) {
            const w = 400, h = 100, cy = 50;
            const topCtx = mathTopRef.current.getContext('2d');
            const midCtx = mathMidRef.current.getContext('2d');
            const botCtx = mathBotRef.current.getContext('2d');
            
            [topCtx, midCtx, botCtx].forEach(ctx => {
              ctx.fillStyle = '#0f172a'; ctx.fillRect(0,0,w,h);
              ctx.strokeStyle = '#334155'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,cy); ctx.lineTo(w,cy); ctx.stroke();
            });

            // 1. Top: Incoming Purple Wave = I*sin(t) + Q*cos(t)
            topCtx.beginPath(); topCtx.strokeStyle='#a855f7'; topCtx.lineWidth=2;
            for(let x=0; x<w; x++) {
              const t = (x*0.05)-time;
              const val = demodI*Math.sin(t) + demodQ*Math.cos(t);
              const y = cy - (val*8);
              if(x===0) topCtx.moveTo(x,y); else topCtx.lineTo(x,y);
            }
            topCtx.stroke();

            // 2. Mid: Local Reference Wave (2*sin(t) or 2*cos(t))
            midCtx.beginPath(); 
            const isSine = demodRefType === 'SINE';
            midCtx.strokeStyle = isSine ? '#3b82f6' : '#ef4444'; 
            midCtx.lineWidth=2;
            for(let x=0; x<w; x++) {
              const t = (x*0.05)-time;
              const val = isSine ? 2*Math.sin(t) : 2*Math.cos(t);
              const y = cy - (val*12);
              if(x===0) midCtx.moveTo(x,y); else midCtx.lineTo(x,y);
            }
            midCtx.stroke();

            // 3. Bot: Multiplied Product + Average Line
            botCtx.beginPath(); botCtx.strokeStyle='#22c55e'; botCtx.lineWidth=2;
            for(let x=0; x<w; x++) {
              const t = (x*0.05)-time;
              const purpleVal = demodI*Math.sin(t) + demodQ*Math.cos(t);
              const refVal = isSine ? 2*Math.sin(t) : 2*Math.cos(t);

              if(x===0) botCtx.moveTo(x,y); else botCtx.lineTo(x,y);

            botCtx.fillStyle = 'white'; botCtx.font = '10px monospace';
            botCtx.fillText(`AVERAGE = ${targetAverage}`, 10, avgY - 5);
          }

          animationRef.current = requestAnimationFrame(render);
        };

        render();
        return () => cancelAnimationFrame(animationRef.current);

                  <div className="text-center mb-8">
                    <div className="w-16 h-16 bg-orange-100 text-orange-500 rounded-full flex items-center justify-center mx-auto mb-4"><FileSignature className="w-8 h-8" /></div>
                    <h2 className="text-2xl font-black text-slate-800">Register Certification</h2>
                    <p className="text-slate-500 mt-2 text-sm">Enter your name exactly as it should appear on your official digital certificate.</p>
                  </div>
                  <form onSubmit={(e) => { e.preventDefault(); if (studentName.trim().length > 0) { setCertUnlocked(true); setActiveTab('CERT'); } }}>
                    <div className="mb-6">
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Official Learner Name</label>
                      <input type="text" value={studentName} onChange={(e) => setStudentName(e.target.value)} className="w-full border-2 border-slate-200 rounded-lg p-4 text-xl font-bold text-slate-800 focus:border-orange-500 outline-none" required />
                    </div>
                    <button type="submit" className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-lg shadow-lg flex items-center justify-center">Generate Secure Certificate <Award className="w-5 h-5 ml-2" /></button>
                  </form>
                </div>
              </div>
            )}

            {/* --- TAB 5: CERTIFICATE --- */}
            {activeTab === 'CERT' && (
              <div className="w-full p-8 flex flex-col items-center justify-center bg-slate-900">
                <div className="relative bg-slate-800 rounded-xl p-1 max-w-2xl w-full" style={{ animation: 'certGlow 4s infinite' }}>
                  <div className="bg-slate-900 rounded-lg p-8 h-full border border-slate-700 relative overflow-hidden">
                    <Activity className="absolute -bottom-10 -right-10 w-64 h-64 text-slate-800 opacity-50" />
                    <Target className="absolute -top-10 -left-10 w-48 h-48 text-slate-800 opacity-50" />
                    <div className="relative z-10 text-center border-2 border-slate-700 p-8 rounded">
                      <div className="flex justify-center mb-6"><Trophy className="w-16 h-16 text-yellow-500" /></div>
                      <h4 className="text-purple-400 font-mono tracking-widest text-sm mb-2 uppercase">Official Certification</h4>
                      <h2 className="text-3xl sm:text-4xl font-black text-white mb-8">CERTIFIED QAM OPERATOR</h2>
                      <p className="text-slate-400 text-sm mb-4">This certifies that</p>
                      <div className="mb-8"><span className="text-5xl sm:text-6xl font-black anti-forge-text break-words">{studentName}</span></div>
                      <p className="text-slate-400 text-sm mb-8 leading-relaxed max-w-md mx-auto">
                        has successfully demonstrated practical competency in PLL synchronization, demodulation math, and manual 16-QAM wave modulation.
                      </p>
                      <div className="flex justify-between items-center border-t border-slate-700 pt-6 mt-6">
                        <div className="text-left"><div className="text-xs text-slate-500 uppercase font-bold tracking-wider">Final Score</div><div className="text-xl font-mono text-purple-400">{finalScore}</div></div>
                        <div className="text-right"><div className="text-xs text-slate-500 uppercase font-bold tracking-wider">Timestamp / Hash</div><div className="text-sm font-mono text-slate-300">{new Date().toLocaleDateString()} / {certHash}</div></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
