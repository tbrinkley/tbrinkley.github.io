<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Static Electricity Simulator | Triboelectric Effect Sandbox</title>
  <meta name="description" content="Interactive Static Electricity Simulator demonstrating the triboelectric effect, electron transfer from hair to a rubber balloon, electrostatic attraction, and piezoelectric energy harvesting.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z'/%3E%3C/svg%3E">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & Babel Standalone (zero-build browser JSX runtime) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Analytics 4 (EDDI) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-73MT2SKH8F"></script>
  <script src="js/analytics.js"></script>
</head>
<body class="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Inline Lucide-compatible 24x24 SVG Icon Components (supports Lucide `size` prop)
    const createIcon = (children) => ({ size = 24, className = "", ...props }) => (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width={size}
        height={size}
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth="2"
        strokeLinecap="round"
        strokeLinejoin="round"
        className={className}
        aria-hidden="true"
        {...props}
      >
        {children}
      </svg>
    );

    const RotateCcw = createIcon(<>
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
      <path d="M3 3v5h5" />
    </>);
    const Play = createIcon(<polygon points="6 3 20 12 6 21 6 3" />);
    const Info = createIcon(<>
      <circle cx="12" cy="12" r="10" />
      <path d="M12 16v-4" />
      <path d="M12 8h.01" />
    </>);
    const Zap = createIcon(<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" />);

    // --- Hardcoded Initial Charge Positions for Deterministic Rendering ---
    const fixedHairProtons = [
      {x: 100, y: 360}, {x: 130, y: 345}, {x: 170, y: 345}, {x: 200, y: 360},
      {x: 110, y: 380}, {x: 150, y: 370}, {x: 190, y: 380},
      {x: 95, y: 410}, {x: 205, y: 410},
      {x: 120, y: 420}, {x: 150, y: 430}, {x: 180, y: 420}
    ];
    const fixedHairElectrons = [
      {x: 115, y: 360}, {x: 185, y: 360}, {x: 105, y: 395}, {x: 195, y: 395}
    ];

    const fixedBalloonProtons = [
      {x: -15, y: -30}, {x: 20, y: -20}, {x: 0, y: 10}, 
      {x: -25, y: 30}, {x: 25, y: 40}, {x: 5, y: -50}
    ];
    const fixedBalloonElectrons = [
      {x: 15, y: -40}, {x: -20, y: -10}, {x: 25, y: 10}, 
      {x: -10, y: 25}, {x: 10, y: 50}, {x: -30, y: 50}
    ];

    // Electrons that will transfer from hair to balloon
    const transferElectronsInitial = [
      {id: 0, startX: 140, startY: 335, ox: -10, oy: -15},
      {id: 1, startX: 160, startY: 335, ox: 10, oy: 20},
      {id: 2, startX: 120, startY: 350, ox: -20, oy: 5},
      {id: 3, startX: 180, startY: 350, ox: 20, oy: -5},
      {id: 4, startX: 100, startY: 375, ox: 0, oy: 35},
      {id: 5, startX: 200, startY: 375, ox: 15, oy: 60},
      {id: 6, startX: 135, startY: 365, ox: -15, oy: 45},
      {id: 7, startX: 165, startY: 365, ox: 5, oy: -35},
    ];

    // Hair base generator
    const hairBases = Array.from({ length: 25 }).map((_, i) => {
      const angle = -Math.PI + (i / 24) * Math.PI; 
      return {
        id: i,
        angle,
        baseX: 150 + Math.cos(angle) * 60,
        baseY: 400 + Math.sin(angle) * 60,
        length: 50 + (i % 3) * 15, 
      };
    });

    // Reusable Charge Marker Component
    const Charge = ({ type, x, y, fastTransition = false }) => (
      <g 
        style={{
          transform: `translate(${x}px, ${y}px)`,
          transitionProperty: 'transform',
          transitionTimingFunction: fastTransition ? 'linear' : 'cubic-bezier(0.4, 0, 0.2, 1)',
          transitionDuration: fastTransition ? '100ms' : '500ms'
        }}
      >
        <circle cx="0" cy="0" r="10" fill={type === '+' ? '#ef4444' : '#3b82f6'} opacity="0.95" />
        <text x="0" y="4.5" textAnchor="middle" fill="white" fontSize="14" fontWeight="bold" fontFamily="Arial, sans-serif" pointerEvents="none">
          {type}
        </text>
      </g>
    );

    function App() {
      const [activeTab, setActiveTab] = useState('simulation');
      const [phase, setPhase] = useState('neutral'); // neutral, moving_to_rub, rubbing, charged
      const [rubProgress, setRubProgress] = useState(0);
      const rubTimeoutRef = useRef(null);

      const rubBalloon = () => {
        if (rubTimeoutRef.current) clearTimeout(rubTimeoutRef.current);
        setPhase('moving_to_rub');
        rubTimeoutRef.current = setTimeout(() => {
          rubTimeoutRef.current = null;
          setPhase('rubbing');
          setRubProgress(0);
        }, 500); // 500ms delay to let the balloon move to the head first
      };

      const reset = () => {
        if (rubTimeoutRef.current) {
          clearTimeout(rubTimeoutRef.current);
          rubTimeoutRef.current = null;
        }
        setPhase('neutral');
        setRubProgress(0);
      };

      // Cleanup pending rub timeout on unmount
      useEffect(() => {
        return () => {
          if (rubTimeoutRef.current) clearTimeout(rubTimeoutRef.current);
        };
      }, []);

      // The animation loop for the rubbing phase
      useEffect(() => {
        let interval;
        if (phase === 'rubbing') {
          interval = setInterval(() => {
            setRubProgress(p => {
              if (p >= 100) {
                clearInterval(interval);
                setPhase('charged');
                return 100;
              }
              return p + 2.5; // Finishes rubbing in ~2 seconds (40 ticks * 50ms)
            });
          }, 50);
        }
        return () => clearInterval(interval);
      }, [phase]);

      // --- Calculate Dynamic Positions ---
      let bx = 450;
      let by = 200;
      let balloonRotate = 15;

      if (phase === 'moving_to_rub') {
        bx = 150;
        by = 280;
        balloonRotate = -20;
      } else if (phase === 'rubbing') {
        bx = 150 + Math.sin(rubProgress / 5) * 35;
        by = 280 + Math.cos(rubProgress / 3) * 20;
        balloonRotate = -20 + Math.sin(rubProgress / 2) * 10;
      } else if (phase === 'charged') {
        bx = 320;
        by = 180;
        balloonRotate = -25;
      }

      // --- Calculate Hair Paths ---
      const currentHairs = hairBases.map(h => {
        let tipX, tipY, cpX, cpY;

        if (phase === 'neutral' || phase === 'moving_to_rub') {
           tipX = h.baseX + Math.cos(h.angle) * 20; 
           tipY = h.baseY + h.length;
           cpX = h.baseX + Math.cos(h.angle) * 30;
           cpY = h.baseY + h.length / 2;
        } else if (phase === 'rubbing') {
           const dx = h.baseX - bx;
           const dy = h.baseY - by;
           const dist = Math.sqrt(dx*dx + dy*dy);
           const ruffleX = Math.sin(rubProgress + h.id) * 15;
           const ruffleY = Math.cos(rubProgress + h.id) * 15;

           if (dist < 120) {
              tipX = h.baseX - (dx/dist)*h.length * 0.8 + ruffleX;
              tipY = h.baseY - (dy/dist)*h.length * 0.8 + ruffleY;
           } else {
              tipX = h.baseX + Math.cos(h.angle) * 20 + ruffleX; 
              tipY = h.baseY + h.length + ruffleY;
           }
           cpX = h.baseX + ruffleX/2;
           cpY = h.baseY + 20 + ruffleY/2;
        } else if (phase === 'charged') {
           const dx = bx - h.baseX;
           const dy = by - h.baseY;
           const dist = Math.sqrt(dx*dx + dy*dy);
           const reach = Math.min(dist - 50, h.length * 1.5); 
           
           const reachX = (dx / dist) * reach;
           const reachY = (dy / dist) * reach;
           
           tipX = h.baseX + reachX;
           tipY = h.baseY + reachY;
           cpX = h.baseX + reachX * 0.5 - 20;
           cpY = h.baseY + reachY * 0.5 - 30;
        }

        return { ...h, tipX, tipY, cpX, cpY };
      });

      // --- Calculate Transfer Electrons ---
      const activeTransfer = transferElectronsInitial.map(te => {
        const isTransferred = phase === 'charged' || (phase === 'rubbing' && rubProgress > te.id * 12.5);
        let x, y;
        
        if (isTransferred) {
          // Calculate global position based on rotated balloon anchor
          const rad = balloonRotate * Math.PI / 180;
          const rotX = te.ox * Math.cos(rad) - te.oy * Math.sin(rad);
          const rotY = te.ox * Math.sin(rad) + te.oy * Math.cos(rad);
          x = bx + rotX;
          y = by + rotY;
        } else {
          x = te.startX;
          y = te.startY;
        }
        
        return { ...te, x, y, isTransferred };
      });

      // --- State Text Explanations ---
      let statusTitle = "Neutral State";
      let statusText = "Both the hair and the balloon have an equal number of positive (+) and negative (-) charges. They are electrically neutral.";

      if (phase === 'moving_to_rub' || phase === 'rubbing') {
        statusTitle = "Triboelectric Transfer";
        statusText = "Friction from rubbing provides energy, allowing the electron-greedy rubber balloon to strip negative electrons from the hair.";
      } else if (phase === 'charged') {
        statusTitle = "Electrostatic Attraction";
        statusText = "The balloon is now negatively charged, and the hair is positively charged. Opposite charges attract, causing the hair to stand up and reach for the balloon!";
      }

      return (
        <div className="min-h-screen bg-slate-100 p-4 md:p-8 flex flex-col items-center font-sans">
          {/* Back to Home Bar */}
          <div className="max-w-5xl w-full mb-3 flex items-center justify-between gap-2">
            <a
              href="index.html#interactive"
              className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-amber-300 text-xs font-bold shadow-sm transition"
            >
              ← Back to Home
            </a>
            <span className="text-[11px] font-mono font-bold uppercase tracking-widest text-slate-500">
              Science Sandbox • Just For Fun
            </span>
          </div>

          <div className="max-w-5xl w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
            
            {/* Header */}
            <div className="bg-indigo-600 text-white p-6 text-center">
              <h1 className="text-3xl font-bold mb-2">Static Electricity Simulator</h1>
              <p className="text-indigo-100 font-medium">Observe the triboelectric effect in action!</p>
              
              {/* Tabs */}
              <div className="flex justify-center gap-4 mt-6">
                <button 
                  onClick={() => setActiveTab('simulation')}
                  className={`flex items-center gap-2 px-6 py-2 rounded-full font-bold transition-colors ${activeTab === 'simulation' ? 'bg-white text-indigo-600' : 'bg-indigo-500 text-white hover:bg-indigo-400'}`}
                >
                  <Play size={18} /> Simulation
                </button>
                <button 
                  onClick={() => setActiveTab('info')}
                  className={`flex items-center gap-2 px-6 py-2 rounded-full font-bold transition-colors ${activeTab === 'info' ? 'bg-white text-indigo-600' : 'bg-indigo-500 text-white hover:bg-indigo-400'}`}
                >
                  <Zap size={18} /> Beyond Static
                </button>
              </div>
            </div>

            {activeTab === 'simulation' ? (
              <div className="flex flex-col lg:flex-row">
                
                {/* Canvas Section */}
                <div className="relative flex-1 bg-slate-50 p-4 flex justify-center items-center border-b lg:border-b-0 lg:border-r border-slate-200">
                  <svg width="600" height="500" viewBox="0 0 600 500" className="max-w-full h-auto bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                     
                     {/* Body / Neck */}
                     <path d="M 50 500 C 50 400, 250 400, 250 500 Z" fill="#cbd5e1" />
                     {/* Head Base */}
                     <circle cx="150" cy="400" r="60" fill="#f1f5f9" />
                     {/* Face */}
                     <circle cx="150" cy="390" r="5" fill="#475569" />
                     <circle cx="185" cy="390" r="5" fill="#475569" />
                     <path d="M 155 415 Q 165 425 175 415" fill="none" stroke="#475569" strokeWidth="3" strokeLinecap="round" />

                     {/* Hair Strands */}
                     {currentHairs.map(h => (
                       <path 
                         key={`hair-${h.id}`}
                         d={`M ${h.baseX} ${h.baseY} Q ${h.cpX} ${h.cpY} ${h.tipX} ${h.tipY}`} 
                         fill="none" 
                         stroke="#475569" 
                         strokeWidth="3" 
                         strokeLinecap="round"
                         className="transition-all duration-300"
                         style={{ transitionTimingFunction: phase === 'rubbing' ? 'linear' : 'ease-out' }}
                       />
                     ))}

                   {/* Fixed Hair Charges (Do not transfer) */}
                   {fixedHairProtons.map((p, i) => <Charge key={`hp-${i}`} type="+" x={p.x} y={p.y} />)}
                   {fixedHairElectrons.map((e, i) => <Charge key={`he-${i}`} type="-" x={e.x} y={e.y} />)}

                   {/* Balloon Group */}
                   <g 
                     style={{
                       transform: `translate(${bx}px, ${by}px) rotate(${balloonRotate}deg)`,
                       transitionProperty: 'transform',
                       transitionTimingFunction: phase === 'rubbing' ? 'linear' : 'cubic-bezier(0.4, 0, 0.2, 1)',
                       transitionDuration: phase === 'rubbing' ? '50ms' : '500ms'
                     }}
                   >
                     {/* String */}
                     <path d="M 0 85 Q -20 120 10 160 T -10 200" fill="none" stroke="#fcd34d" strokeWidth="3" strokeLinecap="round" />
                     {/* Knot */}
                     <path d="M -10 75 L 10 75 L 15 85 L -15 85 Z" fill="#eab308" stroke="#ca8a04" strokeWidth="2" strokeLinejoin="round" />
                     {/* Balloon Body */}
                     <path d="M 0 -60 C 40 -60, 50 -10, 50 20 C 50 50, 20 70, 0 75 C -20 70, -50 50, -50 20 C -50 -10, -40 -60, 0 -60 Z" fill="rgba(250, 204, 21, 0.85)" stroke="#ca8a04" strokeWidth="2" />

                     {/* Fixed Balloon Charges */}
                     {fixedBalloonProtons.map((p, i) => <Charge key={`bp-${i}`} type="+" x={p.x} y={p.y} />)}
                     {fixedBalloonElectrons.map((e, i) => <Charge key={`be-${i}`} type="-" x={e.x} y={e.y} />)}
                   </g>

                   {/* Transfer Electrons (These move from hair to balloon globally) */}
                   {activeTransfer.map((te) => (
                     <Charge 
                       key={`te-${te.id}`} 
                       type="-" 
                       x={te.x} 
                       y={te.y} 
                       fastTransition={phase === 'rubbing'} 
                     />
                   ))}
                </svg>
                
                {/* Real-time Event Indicator */}
                {phase === 'rubbing' && (
                  <div className="absolute top-8 right-8 bg-white/95 px-5 py-3 rounded-xl shadow-lg border border-blue-200 animate-pulse flex items-center gap-3">
                     <div className="w-4 h-4 bg-blue-500 rounded-full flex justify-center items-center">
                        <span className="text-white text-xs font-bold leading-none -mt-0.5">-</span>
                     </div>
                     <span className="text-blue-800 font-bold text-sm">Electrons transferring: Hair ➔ Balloon</span>
                  </div>
                )}
              </div>

              {/* Controls & Explanation Section */}
              <div className="w-full lg:w-96 p-6 flex flex-col justify-between bg-white">
                 <div>
                    <h2 className="text-2xl font-extrabold text-slate-800 mb-2">{statusTitle}</h2>
                    <p className="text-slate-600 mb-8 min-h-[4rem] leading-relaxed">{statusText}</p>
                    
                    <div className="bg-indigo-50 rounded-xl p-5 border border-indigo-100 mb-8 shadow-sm">
                      <h3 className="font-bold text-indigo-900 mb-3 text-lg">What's happening?</h3>
                      <ul className="list-disc pl-5 space-y-3 text-indigo-800 text-sm">
                        <li><strong>Triboelectric Effect:</strong> Friction between materials causes a charge transfer.</li>
                        <li><strong>Rubber vs. Hair:</strong> The balloon rubber easily grabs electrons, while hair gives them up.</li>
                        <li><strong>The Transfer:</strong> Negative electrons (-) physically move from the hair to the balloon.</li>
                        <li><strong>The Result:</strong> The net opposite charges attract, pulling the hair toward the balloon.</li>
                      </ul>
                    </div>
                 </div>

                 <div className="flex gap-4">
                    <button 
                      onClick={rubBalloon} 
                      disabled={phase !== 'neutral'}
                      className={`flex-1 flex justify-center items-center gap-2 py-4 px-4 rounded-xl font-bold transition-all ${
                        phase === 'neutral' 
                          ? 'bg-indigo-600 text-white hover:bg-indigo-700 shadow-lg hover:shadow-xl transform hover:-translate-y-0.5' 
                          : 'bg-slate-100 text-slate-400 cursor-not-allowed border border-slate-200'
                      }`}
                    >
                      <Play size={20} />
                      Rub Balloon
                    </button>
                    <button 
                     onClick={reset}
                     disabled={phase === 'neutral'}
                     className={`flex-none flex justify-center items-center p-4 rounded-xl font-bold transition-all ${
                       phase !== 'neutral'
                         ? 'bg-slate-800 text-white hover:bg-slate-700 shadow-lg'
                         : 'bg-slate-100 text-slate-300 cursor-not-allowed border border-slate-200'
                     }`}
                     aria-label="Reset Simulation"
                     title="Reset Simulation"
                   >
                     <RotateCcw size={20} />
                   </button>
                </div>
             </div>
           </div>
           ) : (
             <div className="p-8 max-w-4xl mx-auto text-slate-700 space-y-8">
               <section>
                 <h2 className="text-2xl font-bold text-slate-800 mb-4 flex items-center gap-2"><Info className="text-indigo-600"/> The Triboelectric Series</h2>
                 <p className="mb-4 leading-relaxed">
                   Not all materials react the same way to friction. Scientists use the "Triboelectric Series" to rank materials based on how easily they gain or lose electrons. The further apart two materials are on this list, the stronger the static shock they will create when rubbed together!
                 </p>
                 <ul className="list-disc pl-5 space-y-2">
                   <li><strong>Highly Positive (Loses electrons easily):</strong> Human skin, rabbit fur, glass, and human hair.</li>
                   <li><strong>Neutral:</strong> Cotton, steel, and wood.</li>
                   <li><strong>Highly Negative (Gains electrons easily):</strong> Teflon, silicone, PVC plastic, and rubber balloons.</li>
                 </ul>
               </section>

               <hr className="border-slate-200" />

               <section>
                 <h2 className="text-2xl font-bold text-slate-800 mb-4 flex items-center gap-2"><Zap className="text-indigo-600"/> Harvesting Kinetic Energy</h2>
                 <p className="mb-4 leading-relaxed">
                   Static electricity isn't the only way to generate power from human interaction. Another fascinating method uses <strong>Piezoelectricity</strong>. This is a unique property of certain materials (like quartz crystals or specially engineered ceramics) that generate an electrical charge when they are physically squeezed, pressed, or bent.
                 </p>
                 <p className="mb-4 leading-relaxed">
                   This technology has been successfully deployed in high-traffic areas around the world, including smart city initiatives, airports in China, and major train stations in Japan. Here are a few ways human movement is converted to electricity:
                 </p>
                 <ul className="list-disc pl-5 space-y-2">
                   <li><strong>Energy-Harvesting Floor Tiles:</strong> When pedestrians walk over these smart tiles, the kinetic energy from their weight compresses the piezoelectric materials inside. The resulting charge powers LED lighting, electronic ticket gates, or nearby display boards.</li>
                   <li><strong>Smart Wearables:</strong> Researchers are weaving piezoelectric fibers into clothing to trickle-charge small devices (like smartwatches or health monitors) using the natural stretching and movement of the wearer's body.</li>
                   <li><strong>Eco-Dance Floors:</strong> Several nightclubs globally use spring-loaded floors equipped with piezoelectric blocks to harvest the kinetic energy from crowds jumping up and down, routing it back to the venue's electrical grid!</li>
                 </ul>
               </section>
             </div>
           )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
